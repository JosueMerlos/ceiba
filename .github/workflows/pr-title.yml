name: PR title

# Why pull_request and not pull_request_target: the job only needs the title from the event payload and a read-only
# token, so it does not need the elevated context of pull_request_target, which GitHub restricts on public repos.
# The validator script is still checked out from the base branch, so a PR that only edits the script cannot loosen
# the rule that validates its own title; a PR that edits this workflow is caught by review on the protected branch.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  pr-title:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      # Only the validator from the base branch is checked out, never PR code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: infra/scripts
          persist-credentials: false
      - name: Conventional commits
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: infra/scripts/check-pr-title.sh "$PR_TITLE"
