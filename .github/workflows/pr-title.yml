name: PR title

# Why pull_request_target: the validator ALWAYS runs from main (base branch checkout), not from the PR, so a PR cannot
# change the rule that validates it, and the token can read the PR even from a fork. It is safe because the job never
# checks out PR code: it only validates the title (passed via env var, never interpolated into the script).
# Consequence: the workflow and script must exist on main before they apply.
on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  pr-title:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      # Only the validator from the base branch (main) is checked out, never PR code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: infra/scripts
          persist-credentials: false
      - name: Conventional commits
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: infra/scripts/check-pr-title.sh "$PR_TITLE"
