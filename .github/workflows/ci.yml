name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: jobs only read the code.
permissions:
  contents: read

# A new push to the same branch cancels the previous run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Each job's steps live in backend/bin/ci-* and frontend/bin/ci-*: they are EXACTLY what `bin/ci` runs locally in Docker.
# Versions come from .tool-versions (checked by infra/scripts/check-versions.sh).
env:
  DB_HOST: localhost
  POSTGRES_USER: ceiba
  POSTGRES_PASSWORD: ceiba_ci_password # ephemeral CI service password, not a secret
  # Application roles: created by infra/db/init-roles.sh because the postgres service has no initdb.d.
  APP_OWNER_PASSWORD: ceiba_owner_ci_password # same: ephemeral service, not a secret
  APP_USER_PASSWORD: ceiba_user_ci_password
  REDIS_URL: redis://localhost:6379/0

jobs:
  actionlint:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Sintaxis de los workflows (misma imagen que bin/ci)
        run: docker run --rm -v "$PWD":/repo -w /repo rhysd/actionlint:1.7.12

  backend-lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # fetch-depth 0: the large-file guard checks every blob the branch adds since the merge-base.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Versiones consistentes con .tool-versions
        run: infra/scripts/check-versions.sh
      - name: Acciones fijadas por SHA de commit
        run: infra/scripts/check-action-pins.sh
      - name: Casos de prueba del validador de títulos de PR
        run: infra/scripts/check-pr-title_test.sh
      - name: Casos de prueba del límite de archivos grandes
        run: infra/scripts/check-large-files_test.sh
      - name: Sin binarios > 100 KiB ni archivos > 1 MiB
        env:
          # PR: against the target branch. Push to main: against the commit before the push.
          BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: infra/scripts/check-large-files.sh
      # Ruby comes from backend/.ruby-version; gems are cached by Gemfile.lock.
      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          bundler-cache: true
          working-directory: backend
      - run: backend/bin/ci-lint

  backend-packs:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # fetch-depth 0: the package_todo.yml check needs the merge-base with the target branch.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Casos de prueba del check de crecimiento de package_todo.yml
        run: infra/scripts/check-package-todo-growth_test.sh
      - name: Ningún package_todo.yml crece
        env:
          # PR: against the target branch. Push to main: against the commit before the push.
          BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: infra/scripts/check-package-todo-growth.sh
      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          bundler-cache: true
          working-directory: backend
      - run: backend/bin/ci-packs

  backend-migrations:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18.6-trixie
        env:
          POSTGRES_USER: ceiba
          POSTGRES_PASSWORD: ceiba_ci_password
          POSTGRES_DB: ceiba_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ceiba -d ceiba_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # pg_dump (structure.sql) needs the SAME major version as the server: the runner ships client 16 and `db:migrate`
      # would abort with "server version mismatch". postgresql-client-18 comes from PGDG (checked by check-versions.sh).
      - name: Cliente PostgreSQL 18 (pg_dump igual que el servidor)
        run: |
          sudo install -d /usr/share/keyrings
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor --yes -o /usr/share/keyrings/pgdg.gpg
          echo "deb [signed-by=/usr/share/keyrings/pgdg.gpg] https://apt.postgresql.org/pub/repos/apt noble-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client-18
          echo /usr/lib/postgresql/18/bin >> "$GITHUB_PATH"
      - name: Roles de base de datos (app_owner, app_user)
        run: infra/db/init-roles.sh
      - name: Prueba de init-roles.sh (idempotencia, identity, particiones)
        run: infra/db/init-roles_test.sh
      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          bundler-cache: true
          working-directory: backend
      # Migrates from scratch, rolls back the last migration and migrates again; db/structure.sql must not change.
      - run: backend/bin/ci-migrations

  backend-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.6-trixie
        env:
          POSTGRES_USER: ceiba
          POSTGRES_PASSWORD: ceiba_ci_password
          POSTGRES_DB: ceiba_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ceiba -d ceiba_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7.4.12-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # pg_dump (structure.sql) needs the SAME major version as the server: the runner ships client 16 and `db:migrate`
      # would abort with "server version mismatch". postgresql-client-18 comes from PGDG (checked by check-versions.sh).
      - name: Cliente PostgreSQL 18 (pg_dump igual que el servidor)
        run: |
          sudo install -d /usr/share/keyrings
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor --yes -o /usr/share/keyrings/pgdg.gpg
          echo "deb [signed-by=/usr/share/keyrings/pgdg.gpg] https://apt.postgresql.org/pub/repos/apt noble-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client-18
          echo /usr/lib/postgresql/18/bin >> "$GITHUB_PATH"
      - name: Roles de base de datos (app_owner, app_user)
        run: infra/db/init-roles.sh
      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          bundler-cache: true
          working-directory: backend
      - run: backend/bin/ci-test

  backend-security:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          bundler-cache: true
          working-directory: backend
      - run: backend/bin/ci-security

  frontend-lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.18.0
          package_json_file: frontend/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .tool-versions
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: frontend/bin/ci-lint

  frontend-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.18.0
          package_json_file: frontend/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .tool-versions
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: frontend/bin/ci-test

  frontend-security:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.18.0
          package_json_file: frontend/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .tool-versions
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: frontend/bin/ci-security

  # Regenerates backend/openapi/v1.yaml (rswag) and the TS client (openapi-typescript) and fails if they differ from the
  # committed ones. Same steps as `bin/ci api-contract`.
  api-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.6-trixie
        env:
          POSTGRES_USER: ceiba
          POSTGRES_PASSWORD: ceiba_ci_password
          POSTGRES_DB: ceiba_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ceiba -d ceiba_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7.4.12-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Casos de prueba del check de drift
        run: infra/scripts/check-api-contract_test.sh
      # Same reason as in backend-test: the schema task runs pg_dump, which needs the same major version as the server.
      - name: Cliente PostgreSQL 18 (pg_dump igual que el servidor)
        run: |
          sudo install -d /usr/share/keyrings
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor --yes -o /usr/share/keyrings/pgdg.gpg
          echo "deb [signed-by=/usr/share/keyrings/pgdg.gpg] https://apt.postgresql.org/pub/repos/apt noble-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client-18
          echo /usr/lib/postgresql/18/bin >> "$GITHUB_PATH"
      - name: Roles de base de datos (app_owner, app_user)
        run: infra/db/init-roles.sh
      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          bundler-cache: true
          working-directory: backend
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.18.0
          package_json_file: frontend/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .tool-versions
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Contrato y cliente al día
        env:
          OPENAPI_GENERATE: backend/bin/ci-openapi
          CLIENT_GENERATE: frontend/bin/ci-api-client
        run: infra/scripts/check-api-contract.sh

  # Bundle budget for the public booking app: critical JS < 150 KiB gzip. Same step as `bin/ci frontend-bundle`.
  frontend-bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.18.0
          package_json_file: frontend/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .tool-versions
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: frontend/bin/ci-bundle

  # Playwright E2E against the full Compose environment. Runs on PRs too: it is a required check, so a job skipped on PRs
  # would block every merge. Same step as `bin/ci e2e`; on failure the report and screenshots are kept as `e2e-report`.
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: bin/ci e2e
        env:
          # In CI a flaky E2E is retried once (the report keeps the trace); locally there are no retries.
          E2E_RETRIES: "1"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-report
          path: |
            frontend/e2e/playwright-report
            frontend/e2e/test-results
            frontend/e2e/screenshots
          if-no-files-found: ignore
          retention-days: 14
