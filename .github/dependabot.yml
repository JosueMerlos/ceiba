# Monthly Dependabot. Commit messages use "chore(deps)" / "ci(deps)" so the PR title passes the conventional-commits check.
version: 2
updates:
  - package-ecosystem: bundler
    directory: /backend
    schedule: { interval: monthly }
    commit-message: { prefix: chore, include: scope }
    open-pull-requests-limit: 5
    groups:
      rails-ecosystem:
        patterns: ["rails", "rails-*", "action*", "active*"]
      lint-and-test:
        patterns: ["rubocop*", "rspec*", "factory_bot*", "brakeman", "bundler-audit"]

  - package-ecosystem: npm # cubre pnpm (lee pnpm-lock.yaml)
    directory: /frontend
    schedule: { interval: monthly }
    commit-message: { prefix: chore, include: scope }
    open-pull-requests-limit: 5
    ignore:
      # packages/config pins typescript@6.0.3 because typescript-eslint does not support TS 7 (peer ">=4.8.4 <6.1.0"), and
      # packages/api-client because openapi-typescript needs the TS 6 API. Dependabot cannot ignore per workspace package,
      # so bumps to 6.1-6.x and major jumps are dropped; minor and patch bumps of TS 7.x (apps) still arrive.
      # Remove once typescript-eslint supports TS 7.
      - dependency-name: typescript
        versions: [">=6.1.0 <7.0.0"]
        update-types: ["version-update:semver-major"]
    groups:
      lint-and-format:
        patterns: ["eslint*", "@eslint/*", "typescript-eslint", "prettier*", "globals"]
      testing:
        patterns: ["vitest*", "@vitest/*", "@testing-library/*", "jsdom"]

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    commit-message: { prefix: ci, include: scope }
