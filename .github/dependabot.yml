# Dependabot mensual (M0.02). Los mensajes usan "chore(deps)" / "ci(deps)" para pasar el check
# de conventional commits del título del PR.
version: 2
updates:
  - package-ecosystem: bundler
    directory: /backend
    schedule: { interval: monthly }
    commit-message: { prefix: chore, include: scope }
    open-pull-requests-limit: 5
    groups:
      rails-ecosystem:
        patterns: ["rails", "rails-*", "action*", "active*"]
      lint-and-test:
        patterns: ["rubocop*", "rspec*", "factory_bot*", "brakeman", "bundler-audit"]

  - package-ecosystem: npm # cubre pnpm (lee pnpm-lock.yaml)
    directory: /frontend
    schedule: { interval: monthly }
    commit-message: { prefix: chore, include: scope }
    open-pull-requests-limit: 5
    groups:
      lint-and-format:
        patterns: ["eslint*", "@eslint/*", "typescript-eslint", "prettier*", "globals"]
      testing:
        patterns: ["vitest*", "@vitest/*", "@testing-library/*", "jsdom"]

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    commit-message: { prefix: ci, include: scope }
