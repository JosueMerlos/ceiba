---
components:
  headers:
    IdempotencyReplayed:
      description: "`true` cuando la respuesta es la guardada de una petición anterior con la misma `Idempotency-Key` (repetida, no ejecutada de nuevo)."
      schema:
        enum:
        - 'true'
        type: string
  parameters:
    IdempotencyKey:
      description: 'Clave única (p. ej. un UUID) que hace seguro reintentar la creación: misma clave y mismo cuerpo repiten la respuesta (cabecera `Idempotency-Replayed: true`) y no crean otro recurso; la misma clave con otro método, ruta o cuerpo da `409 idempotency.key_reused`. Vale 24 horas, por organización y principal.'
      in: header
      name: Idempotency-Key
      required: false
      schema:
        example: '0198f0a0-7c3e-7000-8000-5b1f0c2d9e11'
        maxLength: 255
        minLength: 1
        pattern: "^[!-~]+$"
        type: string
    IdempotencyKeyRequired:
      description: 'Clave única (p. ej. un UUID) que hace seguro reintentar la creación: misma clave y mismo cuerpo repiten la respuesta (cabecera `Idempotency-Replayed: true`) y no crean otro recurso; la misma clave con otro método, ruta o cuerpo da `409 idempotency.key_reused`. Vale 24 horas, por organización y principal.'
      in: header
      name: Idempotency-Key
      required: true
      schema:
        example: '0198f0a0-7c3e-7000-8000-5b1f0c2d9e11'
        maxLength: 255
        minLength: 1
        pattern: "^[!-~]+$"
        type: string
  responses:
    IdempotencyKeyInvalid:
      content:
        application/problem+json:
          schema:
            "$ref": "#/components/schemas/Problem"
      description: "`Idempotency-Key` inválida (`idempotency.key_invalid`) o ausente en un endpoint que la exige (`idempotency.key_required`)"
    IdempotencyKeyReused:
      content:
        application/problem+json:
          schema:
            "$ref": "#/components/schemas/Problem"
      description: La `Idempotency-Key` ya se usó con otro método, ruta o cuerpo (código `idempotency.key_reused`)
    IdempotencyRequestInProgress:
      content:
        application/problem+json:
          schema:
            "$ref": "#/components/schemas/Problem"
      description: Otra petición con la misma `Idempotency-Key` sigue en curso (código `idempotency.request_in_progress`); reintenta con la misma clave
  schemas:
    AuthSession:
      additionalProperties: false
      description: 'Sesión del panel: quién es y el token CSRF que debe enviar en `X-CSRF-Token` en toda mutación'
      properties:
        csrf_token:
          description: Ligado a esta sesión; cambia cuando la sesión rota (login). Se guarda en memoria, no en almacenamiento persistente
          type: string
        expires_at:
          description: Caducidad ABSOLUTA de la sesión (UTC); la inactividad de 12 h es aparte
          format: date-time
          type: string
        user:
          "$ref": "#/components/schemas/User"
      required:
      - user
      - csrf_token
      - expires_at
      type: object
    Branch:
      additionalProperties: false
      description: 'Sucursal: una ubicación de una empresa'
      properties:
        address:
          nullable: true
          type: string
        company_id:
          format: uuid
          type: string
        created_at:
          description: UTC
          format: date-time
          type: string
        id:
          format: uuid
          type: string
        name:
          type: string
        phone_e164:
          example: "+50588887777"
          nullable: true
          type: string
        status:
          enum:
          - active
          - inactive
          type: string
        time_zone:
          description: Zona horaria IANA
          example: America/Managua
          type: string
        updated_at:
          description: UTC
          format: date-time
          type: string
      required:
      - id
      - company_id
      - name
      - time_zone
      - address
      - phone_e164
      - status
      - created_at
      - updated_at
      type: object
    Company:
      additionalProperties: false
      description: 'Empresa: un negocio dentro de una organización (ADR-0004)'
      properties:
        business_type:
          example: barbershop
          type: string
        created_at:
          description: UTC
          format: date-time
          type: string
        currency:
          enum:
          - NIO
          - USD
          type: string
        id:
          format: uuid
          type: string
        locale:
          example: es-NI
          type: string
        name:
          type: string
        slug:
          description: Único en toda la plataforma (URL pública /c/:slug)
          example: barberia-guegu
          type: string
        status:
          enum:
          - active
          - inactive
          type: string
        updated_at:
          description: UTC
          format: date-time
          type: string
      required:
      - id
      - name
      - slug
      - business_type
      - currency
      - locale
      - status
      - created_at
      - updated_at
      type: object
    Customer:
      additionalProperties: false
      description: Cliente de una empresa. El teléfono, el correo y las notas solo salen por los endpoints de clientes (`platform.customer.read`).
      properties:
        archived_at:
          description: UTC; null si está activo
          format: date-time
          nullable: true
          type: string
        created_at:
          description: UTC
          format: date-time
          type: string
        email:
          nullable: true
          type: string
        full_name:
          type: string
        id:
          format: uuid
          type: string
        notes:
          nullable: true
          type: string
        phone_e164:
          description: Teléfono en E.164, único por empresa
          example: "+50588887777"
          type: string
        updated_at:
          description: UTC
          format: date-time
          type: string
      required:
      - id
      - full_name
      - phone_e164
      - email
      - notes
      - archived_at
      - created_at
      - updated_at
      type: object
    CustomerInput:
      additionalProperties: false
      description: Alta de un cliente
      properties:
        email:
          maxLength: 254
          nullable: true
          type: string
        full_name:
          maxLength: 200
          type: string
        notes:
          maxLength: 2000
          nullable: true
          type: string
        phone_e164:
          description: En cualquier formato; se normaliza a E.164 con el país de la organización
          example: 8888-7777
          type: string
      required:
      - full_name
      - phone_e164
      type: object
    CustomerPatch:
      additionalProperties: false
      description: 'Edición parcial de un cliente: solo cambian los campos enviados'
      properties:
        email:
          maxLength: 254
          nullable: true
          type: string
        full_name:
          maxLength: 200
          type: string
        notes:
          maxLength: 2000
          nullable: true
          type: string
        phone_e164:
          description: En cualquier formato; se normaliza a E.164
          example: 8888-7777
          type: string
      type: object
    FieldError:
      additionalProperties: false
      properties:
        code:
          description: Tipo del error (blank, taken, invalid...)
          example: blank
          type: string
        field:
          example: company.slug
          type: string
        message:
          example: no puede estar en blanco
          type: string
      required:
      - field
      - code
      - message
      type: object
    Me:
      additionalProperties: false
      description: Respuesta de GET /api/v1/me
      properties:
        data:
          additionalProperties: false
          properties:
            context:
              additionalProperties: false
              description: Lo elegido; cada nivel es null si no hay (usuario sin memberships, sin sucursal elegida)
              properties:
                branch:
                  allOf:
                  - "$ref": "#/components/schemas/Branch"
                  nullable: true
                company:
                  allOf:
                  - "$ref": "#/components/schemas/Company"
                  nullable: true
                organization:
                  allOf:
                  - "$ref": "#/components/schemas/OrganizationSummary"
                  nullable: true
              required:
              - organization
              - company
              - branch
              type: object
            modules:
              description: Módulos ACTIVOS en la empresa del contexto, con los settings resueltos (default -> empresa -> sucursal)
              items:
                additionalProperties: false
                properties:
                  key:
                    example: appointments
                    type: string
                  settings:
                    additionalProperties: true
                    type: object
                  version:
                    example: '1.0'
                    type: string
                required:
                - key
                - version
                - settings
                type: object
              type: array
            navigation:
              items:
                additionalProperties: false
                properties:
                  key:
                    type: string
                  module:
                    type: string
                  path:
                    example: "/agenda"
                    type: string
                required:
                - module
                - key
                - path
                type: object
              type: array
            permissions:
              description: Permisos que el usuario ejerce en el contexto, de los módulos activos y de la plataforma. El frontend los refleja; no decide.
              items:
                type: string
              type: array
            principal:
              additionalProperties: false
              properties:
                email:
                  type: string
                id:
                  format: uuid
                  type: string
                name:
                  type: string
              required:
              - id
              - name
              - email
              type: object
          required:
          - principal
          - context
          - modules
          - permissions
          - navigation
          type: object
      required:
      - data
      type: object
    ModuleActivation:
      additionalProperties: false
      properties:
        data:
          additionalProperties: false
          properties:
            changed:
              description: false si la llamada fue una repetición
              type: boolean
            enabled:
              type: boolean
            key:
              type: string
          required:
          - key
          - enabled
          - changed
          type: object
      required:
      - data
      type: object
    ModuleSettings:
      additionalProperties: false
      properties:
        data:
          additionalProperties: false
          properties:
            key:
              type: string
            settings:
              additionalProperties: true
              description: Settings resueltos del nivel escrito (default -> empresa -> sucursal)
              type: object
          required:
          - key
          - settings
          type: object
      required:
      - data
      type: object
    Organization:
      additionalProperties: false
      description: 'Organización: el tenant (ADR-0003)'
      properties:
        country_code:
          description: ISO 3166-1 alfa-2
          example: NI
          type: string
        created_at:
          description: UTC
          format: date-time
          type: string
        id:
          format: uuid
          type: string
        legal_name:
          nullable: true
          type: string
        name:
          type: string
        status:
          enum:
          - active
          - suspended
          type: string
        updated_at:
          description: UTC
          format: date-time
          type: string
      required:
      - id
      - name
      - legal_name
      - country_code
      - status
      - created_at
      - updated_at
      type: object
    OrganizationSummary:
      additionalProperties: false
      description: Resumen de una organización para el selector de contexto (id, nombre, estado)
      properties:
        id:
          format: uuid
          type: string
        name:
          type: string
        status:
          enum:
          - active
          - suspended
          type: string
      required:
      - id
      - name
      - status
      type: object
    PageInfo:
      additionalProperties: false
      description: Metadatos de la paginación por cursor
      properties:
        has_more:
          type: boolean
        next_cursor:
          description: Cursor opaco para pedir la siguiente página (?after=); null en la última
          nullable: true
          type: string
      required:
      - next_cursor
      - has_more
      type: object
    Problem:
      additionalProperties: false
      description: application/problem+json (RFC 9457)
      properties:
        code:
          description: Código estable y traducible por el frontend (i18n)
          example: resource.not_found
          type: string
        detail:
          description: Explicación específica, solo cuando el error la define
          type: string
        instance:
          description: Ruta de la petición
          example: "/api/v1/organizations/0198f0a0-0000-7000-8000-000000000000"
          type: string
        request_id:
          description: Mismo valor que la cabecera X-Request-Id; sirve para buscar el detalle en el log
          type: string
        status:
          description: Código HTTP, repetido en el cuerpo
          example: 404
          type: integer
        title:
          description: Resumen legible, en el idioma de la API
          example: No se encontró el recurso
          type: string
        type:
          description: URN estable del tipo de problema
          example: urn:ceiba:error:resource.not_found
          type: string
      required:
      - type
      - title
      - status
      - code
      - instance
      - request_id
      type: object
    Service:
      additionalProperties: false
      description: Servicio del catálogo de una empresa. El precio es un entero en unidades menores (`price_minor`) en la moneda de la empresa.
      properties:
        active:
          type: boolean
        archived_at:
          description: UTC; null si no está archivado
          format: date-time
          nullable: true
          type: string
        buffer_after_minutes:
          maximum: 1440
          minimum: 0
          type: integer
        buffer_before_minutes:
          maximum: 1440
          minimum: 0
          type: integer
        created_at:
          description: UTC
          format: date-time
          type: string
        currency:
          description: Siempre la moneda de la empresa
          enum:
          - NIO
          - USD
          type: string
        duration_minutes:
          maximum: 1440
          minimum: 1
          type: integer
        id:
          format: uuid
          type: string
        name:
          type: string
        position:
          description: Orden en el catálogo (menor primero)
          minimum: 0
          type: integer
        price_minor:
          description: Precio en unidades menores (centavos)
          example: 20000
          format: int64
          maximum: 9007199254740991
          minimum: 0
          type: integer
        updated_at:
          description: UTC
          format: date-time
          type: string
      required:
      - id
      - name
      - duration_minutes
      - buffer_before_minutes
      - buffer_after_minutes
      - price_minor
      - currency
      - active
      - position
      - archived_at
      - created_at
      - updated_at
      type: object
    ServiceInput:
      additionalProperties: false
      description: Alta de un servicio. Sin `currency` toma la de la empresa; si se envía debe ser la de la empresa (si no, 422).
      properties:
        active:
          default: true
          type: boolean
        buffer_after_minutes:
          default: 0
          maximum: 1440
          minimum: 0
          type: integer
        buffer_before_minutes:
          default: 0
          maximum: 1440
          minimum: 0
          type: integer
        currency:
          enum:
          - NIO
          - USD
          type: string
        duration_minutes:
          maximum: 1440
          minimum: 1
          type: integer
        name:
          maxLength: 200
          type: string
        position:
          default: 0
          minimum: 0
          type: integer
        price_minor:
          example: 20000
          format: int64
          maximum: 9007199254740991
          minimum: 0
          type: integer
      required:
      - name
      - duration_minutes
      - price_minor
      type: object
    ServiceOverride:
      additionalProperties: false
      description: Duración y/o precio propios de una sucursal para un servicio. Un valor null significa que la sucursal usa el del servicio.
      properties:
        branch_id:
          format: uuid
          type: string
        created_at:
          description: UTC
          format: date-time
          type: string
        currency:
          description: 'La del servicio: el override no tiene moneda propia'
          enum:
          - NIO
          - USD
          type: string
        duration_minutes:
          maximum: 1440
          minimum: 1
          nullable: true
          type: integer
        id:
          format: uuid
          type: string
        price_minor:
          format: int64
          minimum: 0
          nullable: true
          type: integer
        service_id:
          format: uuid
          type: string
        updated_at:
          description: UTC
          format: date-time
          type: string
      required:
      - id
      - branch_id
      - service_id
      - duration_minutes
      - price_minor
      - currency
      - created_at
      - updated_at
      type: object
    ServiceOverrideInput:
      additionalProperties: false
      description: Cambio de un override. Cambia SOLO los campos enviados; lo que no viene se conserva. Un `null` explícito quita ese valor. El resultado debe tener al menos uno de los dos (para quitarlo todo, `DELETE`).
      properties:
        duration_minutes:
          maximum: 1440
          minimum: 1
          nullable: true
          type: integer
        price_minor:
          format: int64
          minimum: 0
          nullable: true
          type: integer
      type: object
    ServicePatch:
      additionalProperties: false
      description: 'Edición parcial de un servicio: solo cambian los campos enviados'
      properties:
        active:
          type: boolean
        buffer_after_minutes:
          maximum: 1440
          minimum: 0
          type: integer
        buffer_before_minutes:
          maximum: 1440
          minimum: 0
          type: integer
        currency:
          enum:
          - NIO
          - USD
          type: string
        duration_minutes:
          maximum: 1440
          minimum: 1
          type: integer
        name:
          maxLength: 200
          type: string
        position:
          minimum: 0
          type: integer
        price_minor:
          format: int64
          maximum: 9007199254740991
          minimum: 0
          type: integer
      type: object
    User:
      additionalProperties: false
      description: 'Persona autenticada. Global: no pertenece a una organización (ADR-0028)'
      properties:
        email:
          description: 'Normalizado: minúsculas y sin espacios'
          format: email
          type: string
        full_name:
          type: string
        id:
          format: uuid
          type: string
      required:
      - id
      - email
      - full_name
      type: object
    ValidationProblem:
      additionalProperties: false
      description: Problema con errores por campo (422 y algunos 400)
      properties:
        code:
          description: Código estable y traducible por el frontend (i18n)
          example: resource.not_found
          type: string
        detail:
          description: Explicación específica, solo cuando el error la define
          type: string
        errors:
          items:
            "$ref": "#/components/schemas/FieldError"
          type: array
        instance:
          description: Ruta de la petición
          example: "/api/v1/organizations/0198f0a0-0000-7000-8000-000000000000"
          type: string
        request_id:
          description: Mismo valor que la cabecera X-Request-Id; sirve para buscar el detalle en el log
          type: string
        status:
          description: Código HTTP, repetido en el cuerpo
          example: 404
          type: integer
        title:
          description: Resumen legible, en el idioma de la API
          example: No se encontró el recurso
          type: string
        type:
          description: URN estable del tipo de problema
          example: urn:ceiba:error:resource.not_found
          type: string
      required:
      - type
      - title
      - status
      - code
      - instance
      - request_id
      - errors
      type: object
  securitySchemes:
    cookieAuth:
      description: Cookie de sesión (HttpOnly) que entrega POST /auth/login. En producción se llama `__Host-ceiba_session`. Las mutaciones exigen además `X-CSRF-Token` (el de `csrf_token`) y, si el navegador envía `Origin`, que sea el propio.
      in: cookie
      name: ceiba_session
      type: apiKey
info:
  description: Contrato de la API v1. Generado por los specs de rswag; no se edita a mano (docs/architecture/07-api-contract.md).
  title: Ceiba API
  version: v1
openapi: 3.0.3
paths:
  "/api/v1/auth/login":
    post:
      description: Correo y contraseña. Entrega la cookie de sesión (`HttpOnly`, `SameSite=Lax`, `Secure` en producción) y el token CSRF. Un correo inexistente y una contraseña errónea dan EXACTAMENTE la misma respuesta.
      parameters:
      - description: Lo envía el navegador; si está presente debe ser el origen propio
        in: header
        name: Origin
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              properties:
                email:
                  format: email
                  type: string
                password:
                  format: password
                  type: string
              required:
              - email
              - password
              type: object
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  data:
                    "$ref": "#/components/schemas/AuthSession"
                required:
                - data
                type: object
          description: sesión iniciada
        '400':
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/ValidationProblem"
          description: faltan el correo o la contraseña
        '401':
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
          description: credenciales inválidas (código `auth.invalid_credentials`)
        '403':
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
          description: "`Origin` que no es el propio (código `auth.origin_forbidden`); frena el login CSRF"
        '415':
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
          description: el cuerpo no es `application/json` (código `request.unsupported_media_type`)
      summary: Inicia sesión
      tags:
      - Autenticación
  "/api/v1/auth/logout":
    delete:
      description: Revoca la sesión del navegador y borra la cookie. Las demás sesiones del usuario siguen vigentes.
      parameters:
      - description: "`csrf_token` de la sesión (login o GET /auth/session)"
        in: header
        name: X-CSRF-Token
        required: true
        schema:
          type: string
      responses:
        '204':
          description: sesión cerrada
        '401':
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
          description: sin sesión válida
        '403':
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
          description: sesión válida sin token CSRF correcto (`auth.csrf_invalid`) o con `Origin` ajeno (`auth.origin_forbidden`)
      security:
      - cookieAuth: []
      summary: Cierra la sesión actual
      tags:
      - Autenticación
  "/api/v1/auth/session":
    get:
      description: Quién es el usuario autenticado y su token CSRF. La SPA lo llama al arrancar para recuperar el token.
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  data:
                    "$ref": "#/components/schemas/AuthSession"
                required:
                - data
                type: object
          description: la sesión vigente
        '401':
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
          description: sin sesión válida (ausente, vencida o revocada; código `auth.unauthenticated`)
      security:
      - cookieAuth: []
      summary: Sesión actual
      tags:
      - Autenticación
  "/api/v1/auth/sessions":
    delete:
      description: Revoca todas las sesiones del usuario, en todos los dispositivos.
      parameters:
      - description: "`csrf_token` de la sesión (login o GET /auth/session)"
        in: header
        name: X-CSRF-Token
        required: true
        schema:
          type: string
      responses:
        '204':
          description: todas las sesiones revocadas
        '401':
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
          description: sin sesión válida
        '403':
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
          description: sesión válida sin token CSRF correcto (`auth.csrf_invalid`) o con `Origin` ajeno (`auth.origin_forbidden`)
      security:
      - cookieAuth: []
      summary: Cierra todas las sesiones
      tags:
      - Autenticación
  "/api/v1/me":
    get:
      description: 'El contexto elegido (organización, empresa y sucursal), los módulos ACTIVOS en esa empresa con sus settings resueltos (default del esquema, empresa, sucursal), los permisos que el usuario ejerce ahí y la navegación permitida. El frontend solo lo REFLEJA: ocultar algo no es control de acceso. Sin parámetros usa el último contexto elegido (cookie firmada `ceiba_context`) o, si no hay, la primera organización y empresa que el usuario ve. Un usuario sin memberships recibe el contexto vacío.'
      parameters:
      - description: Requerido si se pasa company_id
        in: query
        name: organization_id
        required: false
        schema:
          format: uuid
          type: string
      - in: query
        name: company_id
        required: false
        schema:
          format: uuid
          type: string
      - description: Requiere company_id
        in: query
        name: branch_id
        required: false
        schema:
          format: uuid
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Me"
          description: el contexto del usuario
        '400':
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/ValidationProblem"
          description: company_id o branch_id sin su organización/empresa
        '401':
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
          description: sin sesión válida
        '403':
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
          description: la organización elegida está suspendida (`access.organization_suspended`)
        '404':
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
          description: la organización, empresa o sucursal no existe o el usuario no la ve
      security:
      - cookieAuth: []
      summary: Contexto del usuario autenticado
      tags:
      - Contexto
  "/api/v1/organizations":
    get:
      description: Las organizaciones donde el usuario autenticado tiene algún membership (selector de contexto, ADR-0028). Incluye las suspendidas, con su `status`.
