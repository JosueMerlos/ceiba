    ServiceResourceRequirementsInput:
      additionalProperties: false
      description: El conjunto completo de tipos de recurso que necesita el servicio; lo que no viene se quita
      properties:
        kinds:
          items:
            enum:
            - chair
            - room
            - equipment
            type: string
          type: array
          uniqueItems: true
      required:
      - kinds
      type: object
    TimeOff:
      additionalProperties: false
      description: Ausencia de un profesional o de un recurso (exactamente uno de `professional_id` y `resource_id`).
      properties:
        created_at:
          description: UTC
          format: date-time
          type: string
        ends_at:
          description: UTC
          format: date-time
          type: string
        id:
          format: uuid
          type: string
        professional_id:
          format: uuid
          nullable: true
          type: string
        reason:
          description: Texto libre opcional; sin datos de salud
          maxLength: 200
          nullable: true
          type: string
        resource_id:
          format: uuid
          nullable: true
