---
components:
  headers:
    IdempotencyReplayed:
      description: "`true` cuando la respuesta es la guardada de una petición anterior con la misma `Idempotency-Key` (repetida, no ejecutada de nuevo)."
      schema:
        enum:
        - 'true'
        type: string
  parameters:
    IdempotencyKey:
      description: 'Clave única (p. ej. un UUID) que hace seguro reintentar la creación: misma clave y mismo cuerpo repiten la respuesta (cabecera `Idempotency-Replayed: true`) y no crean otro recurso; la misma clave con otro método, ruta o cuerpo da `409 idempotency.key_reused`. Vale 24 horas, por organización y principal.'
      in: header
      name: Idempotency-Key
      required: false
      schema:
        example: '0198f0a0-7c3e-7000-8000-5b1f0c2d9e11'
        maxLength: 255
        minLength: 1
        pattern: "^[!-~]+$"
        type: string
    IdempotencyKeyRequired:
      description: 'Clave única (p. ej. un UUID) que hace seguro reintentar la creación: misma clave y mismo cuerpo repiten la respuesta (cabecera `Idempotency-Replayed: true`) y no crean otro recurso; la misma clave con otro método, ruta o cuerpo da `409 idempotency.key_reused`. Vale 24 horas, por organización y principal.'
      in: header
      name: Idempotency-Key
      required: true
      schema:
        example: '0198f0a0-7c3e-7000-8000-5b1f0c2d9e11'
        maxLength: 255
        minLength: 1
        pattern: "^[!-~]+$"
        type: string
  responses:
    IdempotencyKeyInvalid:
      content:
        application/problem+json:
          schema:
            "$ref": "#/components/schemas/Problem"
      description: "`Idempotency-Key` inválida (`idempotency.key_invalid`) o ausente en un endpoint que la exige (`idempotency.key_required`)"
    IdempotencyKeyReused:
      content:
        application/problem+json:
          schema:
            "$ref": "#/components/schemas/Problem"
      description: La `Idempotency-Key` ya se usó con otro método, ruta o cuerpo (código `idempotency.key_reused`)
    IdempotencyRequestInProgress:
      content:
        application/problem+json:
          schema:
            "$ref": "#/components/schemas/Problem"
      description: Otra petición con la misma `Idempotency-Key` sigue en curso (código `idempotency.request_in_progress`); reintenta con la misma clave
  schemas:
    Appointment:
      additionalProperties: false
      description: 'Una cita reservada. Del cliente solo va su `id`: nunca nombre, teléfono ni correo. `total_price_minor` es la suma de los servicios congelados.'
      properties:
        branch_id:
          format: uuid
          type: string
        cancellation_reason:
          description: Motivo de la cancelación como código; null si no está cancelada
          enum:
          - customer_request
          - professional_unavailable
          - business_decision
          - other
          -
          nullable: true
          type: string
        cancelled_by:
          description: Quién canceló; null si no está cancelada
          enum:
          - staff
          - customer
          - system
          -
          nullable: true
          type: string
        currency:
          enum:
          - NIO
          - USD
          type: string
        customer_id:
          format: uuid
          type: string
        ends_at:
          description: UTC
          format: date-time
          type: string
        id:
          format: uuid
          type: string
        lock_version:
          minimum: 0
          type: integer
        professional_id:
          format: uuid
          type: string
        rescheduled_from_id:
          description: La cita que esta reprogramó; null si no viene de una reprogramación
          format: uuid
          nullable: true
          type: string
        resource_id:
          description: El recurso que asignó el motor; null si los servicios no exigen uno
          format: uuid
          nullable: true
          type: string
        services:
          items:
            "$ref": "#/components/schemas/AppointmentService"
          type: array
        source:
          enum:
          - panel
          - public_booking
          type: string
        starts_at:
          description: UTC
          format: date-time
          type: string
        status:
          enum:
          - scheduled
          - confirmed
          - checked_in
          - completed
          - cancelled
          - rescheduled
          - no_show
          type: string
        total_price_minor:
          format: int64
          minimum: 0
          type: integer
      required:
      - id
      - branch_id
      - professional_id
      - resource_id
      - customer_id
      - starts_at
      - ends_at
      - status
      - source
      - lock_version
      - services
      - total_price_minor
      - currency
      - rescheduled_from_id
      - cancelled_by
      - cancellation_reason
      type: object
    AppointmentCancelInput:
      additionalProperties: false
      properties:
        reason:
          description: Motivo como código de la lista cerrada; ausente o fuera de ella responde 422
          enum:
          - customer_request
          - professional_unavailable
          - business_decision
          - other
          type: string
      type: object
    AppointmentDetail:
      additionalProperties: false
      description: 'El detalle de una cita: lo mismo que `Appointment` más las notas (texto libre cifrado). Solo lo ve quien puede editar la cita.'
      properties:
        branch_id:
          format: uuid
          type: string
        cancellation_reason:
          description: Motivo de la cancelación como código; null si no está cancelada
          enum:
          - customer_request
          - professional_unavailable
          - business_decision
          - other
          -
          nullable: true
          type: string
        cancelled_by:
          description: Quién canceló; null si no está cancelada
          enum:
          - staff
          - customer
          - system
          -
          nullable: true
          type: string
        currency:
          enum:
          - NIO
          - USD
          type: string
        customer_id:
          format: uuid
          type: string
        ends_at:
          description: UTC
          format: date-time
          type: string
        id:
          format: uuid
          type: string
        lock_version:
          minimum: 0
          type: integer
        notes:
          description: Notas operativas de la cita (nunca datos clínicos)
          maxLength: 500
          nullable: true
          type: string
        professional_id:
          format: uuid
          type: string
        rescheduled_from_id:
          description: La cita que esta reprogramó; null si no viene de una reprogramación
          format: uuid
          nullable: true
          type: string
        resource_id:
          description: El recurso que asignó el motor; null si los servicios no exigen uno
          format: uuid
          nullable: true
          type: string
        services:
          items:
            "$ref": "#/components/schemas/AppointmentService"
          type: array
        source:
          enum:
          - panel
          - public_booking
          type: string
        starts_at:
          description: UTC
          format: date-time
          type: string
        status:
          enum:
          - scheduled
          - confirmed
          - checked_in
          - completed
          - cancelled
          - rescheduled
          - no_show
          type: string
        total_price_minor:
          format: int64
          minimum: 0
          type: integer
      required:
      - id
      - branch_id
      - professional_id
      - resource_id
      - customer_id
      - starts_at
      - ends_at
      - status
      - source
      - lock_version
      - services
      - total_price_minor
      - currency
      - rescheduled_from_id
      - cancelled_by
      - cancellation_reason
      - notes
      type: object
    AppointmentInput:
      additionalProperties: false
      description: Reserva desde el panel. `professional_id` es el de un hueco de la disponibilidad; el literal `any` no se acepta (422).
      properties:
        customer_id:
          format: uuid
          type: string
        notes:
          description: Texto libre, se guarda cifrado
          maxLength: 500
          nullable: true
          type: string
        professional_id:
          format: uuid
          type: string
        service_ids:
          description: Servicios de la empresa, en orden de secuencia (hasta 5; más responden 422)
          items:
            format: uuid
            type: string
          maxItems: 5
          minItems: 1
          type: array
        starts_at:
          description: ISO 8601 con segundos y zona horaria (por ejemplo `2026-11-16T10:00:00-06:00`); en el pasado o con fracción de segundo responde 422
          format: date-time
          type: string
      required:
      - customer_id
      - service_ids
      - professional_id
      - starts_at
      type: object
    AppointmentNotesInput:
      additionalProperties: false
      properties:
        lock_version:
          description: La versión que el cliente leyó; si la cita cambió desde entonces responde 409 `resource.stale`
          minimum: 0
          type: integer
        notes:
          description: 'Texto libre, se guarda cifrado; null las borra. Obligatoria: sin la clave responde 400'
          maxLength: 500
          nullable: true
          type: string
      required:
      - notes
      - lock_version
      type: object
    AppointmentRescheduleInput:
      additionalProperties: false
      properties:
        professional_id:
          description: Un profesional asignado a la sucursal; por defecto, el de la cita. El literal `any` no se acepta (422), como al reservar
          format: uuid
          type: string
        starts_at:
          description: 'ISO 8601 con segundos y zona horaria: el nuevo inicio, que el motor debe ofrecer'
          format: date-time
          type: string
      required:
      - starts_at
      type: object
    AppointmentService:
      additionalProperties: false
      description: 'Un servicio de la cita tal como se reservó: duración y precio son una copia, un cambio posterior del catálogo no la reescribe.'
      properties:
        currency:
          enum:
          - NIO
          - USD
          type: string
        duration_minutes:
          minimum: 1
          type: integer
        position:
          description: Orden en la secuencia (0 es el primero)
          minimum: 0
          type: integer
        price_minor:
          description: Precio congelado en unidades menores
          format: int64
          minimum: 0
          type: integer
        service_id:
          format: uuid
          type: string
      required:
      - service_id
      - position
      - duration_minutes
      - price_minor
      - currency
      type: object
    AuthSession:
      additionalProperties: false
      description: 'Sesión del panel: quién es y el token CSRF que debe enviar en `X-CSRF-Token` en toda mutación'
      properties:
        csrf_token:
          description: Ligado a esta sesión; cambia cuando la sesión rota (login). Se guarda en memoria, no en almacenamiento persistente
          type: string
        expires_at:
          description: Caducidad ABSOLUTA de la sesión (UTC); la inactividad de 12 h es aparte
          format: date-time
          type: string
        user:
          "$ref": "#/components/schemas/User"
      required:
      - user
      - csrf_token
      - expires_at
      type: object
    AvailabilityPrice:
      additionalProperties: false
      description: 'Precio total de los servicios pedidos en la sucursal (con sus overrides): entero en unidades menores y moneda.'
      properties:
        amount_minor:
          example: 25000
          format: int64
          minimum: 0
          type: integer
        currency:
          example: NIO
          type: string
      required:
      - amount_minor
      - currency
      type: object
    AvailabilitySlot:
      additionalProperties: false
      description: Un inicio posible para los servicios y su fin (inicio + duración efectiva total). Instantes UTC. `professional_id` es quien atiende (el asignado si se pidió `any`) y `resource_id` el recurso reservado, o nulo si los servicios no piden recurso.
      properties:
        ends_at:
          description: UTC
          format: date-time
          type: string
        professional_id:
          format: uuid
          type: string
        resource_id:
          format: uuid
          nullable: true
          type: string
        starts_at:
          description: UTC
          format: date-time
          type: string
      required:
      - starts_at
      - ends_at
      - professional_id
      - resource_id
      type: object
    Branch:
      additionalProperties: false
      description: 'Sucursal: una ubicación de una empresa'
      properties:
        address:
          nullable: true
          type: string
        company_id:
          format: uuid
          type: string
        created_at:
          description: UTC
          format: date-time
          type: string
        id:
          format: uuid
          type: string
        name:
          type: string
        phone_e164:
          example: "+50588887777"
          nullable: true
          type: string
        status:
          enum:
          - active
          - inactive
          type: string
        time_zone:
          description: Zona horaria IANA
          example: America/Managua
          type: string
        updated_at:
          description: UTC
          format: date-time
          type: string
      required:
      - id
      - company_id
      - name
      - time_zone
      - address
      - phone_e164
      - status
      - created_at
      - updated_at
      type: object
    BranchInput:
      additionalProperties: false
      description: Alta de una sucursal. La empresa sale de la ruta; la sucursal nace sin horario (cerrada) hasta que se configure.
      properties:
        address:
          nullable: true
          type: string
        name:
          type: string
        phone_e164:
          example: "+50588887777"
          nullable: true
          type: string
        time_zone:
          description: Zona horaria IANA
          example: America/Managua
          type: string
      required:
      - name
      - time_zone
      type: object
    Company:
      additionalProperties: false
      description: 'Empresa: un negocio dentro de una organización (ADR-0004)'
      properties:
        business_type:
          example: barbershop
          type: string
        created_at:
          description: UTC
          format: date-time
          type: string
        currency:
          enum:
          - NIO
          - USD
          type: string
        id:
          format: uuid
          type: string
        locale:
          example: es-NI
          type: string
        name:
          type: string
        slug:
          description: Único en toda la plataforma (URL pública /c/:slug)
          example: barberia-guegu
          type: string
        status:
          enum:
          - active
          - inactive
          type: string
        updated_at:
          description: UTC
          format: date-time
          type: string
      required:
      - id
      - name
      - slug
      - business_type
      - currency
      - locale
      - status
      - created_at
      - updated_at
      type: object
    Customer:
      additionalProperties: false
      description: Cliente de una empresa. El teléfono, el correo y las notas solo salen por los endpoints de clientes (`platform.customer.read`).
      properties:
        archived_at:
          description: UTC; null si está activo
          format: date-time
          nullable: true
          type: string
        created_at:
          description: UTC
          format: date-time
          type: string
        email:
          nullable: true
          type: string
        full_name:
          type: string
        id:
          format: uuid
          type: string
        notes:
          nullable: true
          type: string
        phone_e164:
          description: Teléfono en E.164, único por empresa
          example: "+50588887777"
          type: string
        updated_at:
          description: UTC
          format: date-time
          type: string
      required:
      - id
      - full_name
      - phone_e164
      - email
      - notes
      - archived_at
      - created_at
      - updated_at
      type: object
    CustomerInput:
      additionalProperties: false
      description: Alta de un cliente
      properties:
        email:
          maxLength: 254
          nullable: true
          type: string
        full_name:
          maxLength: 200
          type: string
        notes:
          maxLength: 2000
          nullable: true
          type: string
        phone_e164:
          description: En cualquier formato; se normaliza a E.164 con el país de la organización
          example: 8888-7777
          type: string
      required:
      - full_name
      - phone_e164
      type: object
    CustomerPatch:
      additionalProperties: false
      description: 'Edición parcial de un cliente: solo cambian los campos enviados'
      properties:
        email:
          maxLength: 254
          nullable: true
          type: string
        full_name:
          maxLength: 200
          type: string
        notes:
          maxLength: 2000
          nullable: true
          type: string
        phone_e164:
          description: En cualquier formato; se normaliza a E.164
          example: 8888-7777
          type: string
      type: object
    FieldError:
      additionalProperties: false
      properties:
        code:
          description: Tipo del error (blank, taken, invalid...)
          example: blank
          type: string
        field:
          example: company.slug
          type: string
        message:
          example: no puede estar en blanco
          type: string
      required:
      - field
      - code
      - message
      type: object
    Me:
      additionalProperties: false
      description: Respuesta de GET /api/v1/me
      properties:
        data:
          additionalProperties: false
          properties:
            context:
              additionalProperties: false
              description: Lo elegido; cada nivel es null si no hay (usuario sin memberships, sin sucursal elegida)
              properties:
                branch:
                  allOf:
                  - "$ref": "#/components/schemas/Branch"
                  nullable: true
                company:
                  allOf:
                  - "$ref": "#/components/schemas/Company"
                  nullable: true
                organization:
                  allOf:
                  - "$ref": "#/components/schemas/OrganizationSummary"
                  nullable: true
              required:
              - organization
              - company
              - branch
              type: object
            modules:
              description: Módulos ACTIVOS en la empresa del contexto, con los settings resueltos (default -> empresa -> sucursal)
              items:
                additionalProperties: false
                properties:
                  key:
                    example: appointments
                    type: string
                  settings:
                    additionalProperties: true
                    type: object
                  version:
                    example: '1.0'
                    type: string
                required:
                - key
                - version
                - settings
                type: object
              type: array
            navigation:
              items:
                additionalProperties: false
                properties:
                  key:
                    type: string
                  module:
                    type: string
                  path:
                    example: "/agenda"
                    type: string
                required:
                - module
                - key
                - path
                type: object
              type: array
            permissions:
              description: Permisos que el usuario ejerce en el contexto, de los módulos activos y de la plataforma. El frontend los refleja; no decide.
              items:
                type: string
              type: array
            principal:
              additionalProperties: false
              properties:
                email:
                  type: string
                id:
                  format: uuid
                  type: string
                name:
                  type: string
              required:
              - id
              - name
              - email
              type: object
          required:
          - principal
          - context
          - modules
          - permissions
          - navigation
          type: object
      required:
      - data
      type: object
    ModuleActivation:
      additionalProperties: false
      properties:
        data:
          additionalProperties: false
          properties:
            changed:
              description: false si la llamada fue una repetición
              type: boolean
            enabled:
              type: boolean
            key:
              type: string
          required:
          - key
          - enabled
          - changed
          type: object
      required:
      - data
      type: object
    ModuleSettings:
      additionalProperties: false
      properties:
        data:
          additionalProperties: false
          properties:
            key:
              type: string
            settings:
              additionalProperties: true
              description: Settings resueltos del nivel escrito (default -> empresa -> sucursal)
              type: object
          required:
          - key
          - settings
          type: object
      required:
      - data
      type: object
    Organization:
      additionalProperties: false
      description: 'Organización: el tenant (ADR-0003)'
      properties:
        country_code:
          description: ISO 3166-1 alfa-2
          example: NI
          type: string
        created_at:
          description: UTC
          format: date-time
          type: string
        id:
          format: uuid
          type: string
        legal_name:
          nullable: true
          type: string
        name:
          type: string
        status:
          enum:
          - active
          - suspended
          type: string
        updated_at:
          description: UTC
          format: date-time
          type: string
      required:
      - id
      - name
      - legal_name
      - country_code
      - status
      - created_at
      - updated_at
      type: object
    OrganizationSummary:
      additionalProperties: false
      description: Resumen de una organización para el selector de contexto (id, nombre, estado)
      properties:
        id:
          format: uuid
          type: string
        name:
          type: string
        status:
          enum:
          - active
          - suspended
          type: string
      required:
      - id
      - name
      - status
      type: object
    PageInfo:
      additionalProperties: false
      description: Metadatos de la paginación por cursor
      properties:
        has_more:
          type: boolean
        next_cursor:
          description: Cursor opaco para pedir la siguiente página (?after=); null en la última
          nullable: true
          type: string
      required:
      - next_cursor
      - has_more
      type: object
    Problem:
      additionalProperties: false
      description: application/problem+json (RFC 9457)
      properties:
        code:
          description: Código estable y traducible por el frontend (i18n)
          example: resource.not_found
          type: string
        detail:
          description: Explicación específica, solo cuando el error la define
          type: string
        instance:
          description: Ruta de la petición
          example: "/api/v1/organizations/0198f0a0-0000-7000-8000-000000000000"
          type: string
        request_id:
          description: Mismo valor que la cabecera X-Request-Id; sirve para buscar el detalle en el log
          type: string
        status:
          description: Código HTTP, repetido en el cuerpo
          example: 404
          type: integer
        title:
          description: Resumen legible, en el idioma de la API
          example: No se encontró el recurso
          type: string
        type:
          description: URN estable del tipo de problema
          example: urn:ceiba:error:resource.not_found
          type: string
      required:
      - type
      - title
      - status
      - code
      - instance
      - request_id
      type: object
    Professional:
      additionalProperties: false
      description: 'Profesional de una empresa. Una misma persona (`user_id`) puede tener un registro en cada empresa del grupo, con su propio horario. No trae datos de la persona vinculada: solo su identificador.'
      properties:
        active:
          type: boolean
        archived_at:
          description: UTC; null si no está archivado
          format: date-time
          nullable: true
          type: string
        branch_ids:
          description: Sucursales de la empresa donde está asignado
          items:
            format: uuid
            type: string
          type: array
        created_at:
          description: UTC
          format: date-time
          type: string
        display_name:
          maxLength: 120
          type: string
        id:
          format: uuid
          type: string
        service_ids:
          description: Servicios que presta
          items:
            format: uuid
            type: string
          type: array
        updated_at:
          description: UTC
          format: date-time
          type: string
        user_id:
          description: Persona vinculada; null si el profesional no tiene usuario
          format: uuid
          nullable: true
          type: string
      required:
      - id
      - display_name
      - user_id
      - active
      - archived_at
      - branch_ids
      - service_ids
      - created_at
      - updated_at
      type: object
    ProfessionalInput:
      additionalProperties: false
      description: Alta de un profesional. `user_id` debe tener una membresía en la organización y no estar ya vinculado a otro profesional de la empresa.
      properties:
        active:
          default: true
          type: boolean
        display_name:
          maxLength: 120
          minLength: 1
          type: string
        user_id:
          format: uuid
          nullable: true
          type: string
      required:
      - display_name
      type: object
    ProfessionalPatch:
      additionalProperties: false
      description: 'Edición parcial de un profesional: solo cambian los campos enviados; `user_id: null` desvincula a la persona'
      properties:
        active:
          type: boolean
        display_name:
          maxLength: 120
          minLength: 1
          type: string
        user_id:
          format: uuid
          nullable: true
          type: string
      type: object
    ProfessionalServicesInput:
      additionalProperties: false
      description: El conjunto completo de servicios que presta el profesional; lo que no viene se quita
      properties:
        service_ids:
          items:
            format: uuid
            type: string
          type: array
          uniqueItems: true
      required:
      - service_ids
