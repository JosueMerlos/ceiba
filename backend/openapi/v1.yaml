---
components:
  schemas:
    AuthSession:
      additionalProperties: false
      description: 'Sesión del panel: quién es y el token CSRF que debe enviar en `X-CSRF-Token` en toda mutación'
      properties:
        csrf_token:
          description: Ligado a esta sesión; cambia cuando la sesión rota (login). Se guarda en memoria, no en almacenamiento persistente
          type: string
        expires_at:
          description: Caducidad ABSOLUTA de la sesión (UTC); la inactividad de 12 h es aparte
          format: date-time
          type: string
        user:
          "$ref": "#/components/schemas/User"
      required:
      - user
      - csrf_token
      - expires_at
      type: object
    Branch:
      additionalProperties: false
      description: 'Sucursal: una ubicación de una empresa'
      properties:
        address:
          nullable: true
          type: string
        company_id:
          format: uuid
          type: string
        created_at:
          description: UTC
          format: date-time
          type: string
        id:
          format: uuid
          type: string
        name:
          type: string
        phone_e164:
          example: "+50588887777"
          nullable: true
          type: string
        status:
          enum:
          - active
          - inactive
          type: string
        time_zone:
          description: Zona horaria IANA
          example: America/Managua
          type: string
        updated_at:
          description: UTC
          format: date-time
          type: string
      required:
      - id
      - company_id
      - name
      - time_zone
      - address
      - phone_e164
      - status
      - created_at
      - updated_at
      type: object
    Company:
      additionalProperties: false
      description: 'Empresa: un negocio dentro de una organización (ADR-0004)'
      properties:
        business_type:
          example: barbershop
          type: string
        created_at:
          description: UTC
          format: date-time
          type: string
        currency:
          enum:
          - NIO
          - USD
          type: string
        id:
          format: uuid
          type: string
        locale:
          example: es-NI
          type: string
        name:
          type: string
        slug:
          description: Único en toda la plataforma (URL pública /c/:slug)
          example: barberia-guegu
          type: string
        status:
          enum:
          - active
          - inactive
          type: string
        updated_at:
          description: UTC
          format: date-time
          type: string
      required:
      - id
      - name
      - slug
      - business_type
      - currency
      - locale
      - status
      - created_at
      - updated_at
      type: object
    FieldError:
      additionalProperties: false
      properties:
        code:
          description: Tipo del error (blank, taken, invalid...)
          example: blank
          type: string
        field:
          example: company.slug
          type: string
        message:
          example: no puede estar en blanco
          type: string
      required:
      - field
      - code
      - message
      type: object
    Organization:
      additionalProperties: false
      description: 'Organización: el tenant (ADR-0003)'
      properties:
        country_code:
          description: ISO 3166-1 alfa-2
          example: NI
          type: string
        created_at:
          description: UTC
          format: date-time
          type: string
        id:
          format: uuid
          type: string
        legal_name:
          nullable: true
          type: string
        name:
          type: string
        status:
          enum:
          - active
          - suspended
          type: string
        updated_at:
          description: UTC
          format: date-time
          type: string
      required:
      - id
      - name
      - legal_name
      - country_code
      - status
      - created_at
      - updated_at
      type: object
    OrganizationSummary:
      additionalProperties: false
      description: Resumen de una organización para el selector de contexto (id, nombre, estado)
      properties:
        id:
          format: uuid
          type: string
        name:
          type: string
        status:
          enum:
          - active
          - suspended
          type: string
      required:
      - id
      - name
      - status
      type: object
    PageInfo:
      additionalProperties: false
      description: Metadatos de la paginación por cursor
      properties:
        has_more:
          type: boolean
        next_cursor:
          description: Cursor opaco para pedir la siguiente página (?after=); null en la última
          nullable: true
          type: string
      required:
      - next_cursor
      - has_more
      type: object
    Problem:
      additionalProperties: false
      description: application/problem+json (RFC 9457)
      properties:
        code:
          description: Código estable y traducible por el frontend (i18n)
          example: resource.not_found
          type: string
        detail:
          description: Explicación específica, solo cuando el error la define
          type: string
        instance:
          description: Ruta de la petición
          example: "/api/v1/organizations/0198f0a0-0000-7000-8000-000000000000"
          type: string
        request_id:
          description: Mismo valor que la cabecera X-Request-Id; sirve para buscar el detalle en el log
          type: string
        status:
          description: Código HTTP, repetido en el cuerpo
          example: 404
          type: integer
        title:
          description: Resumen legible, en el idioma de la API
          example: No se encontró el recurso
          type: string
        type:
          description: URN estable del tipo de problema
          example: urn:ceiba:error:resource.not_found
          type: string
      required:
      - type
      - title
      - status
      - code
      - instance
      - request_id
      type: object
    User:
      additionalProperties: false
      description: 'Persona autenticada. Global: no pertenece a una organización (ADR-0028)'
      properties:
        email:
          description: 'Normalizado: minúsculas y sin espacios'
          format: email
          type: string
        full_name:
          type: string
        id:
          format: uuid
          type: string
      required:
      - id
      - email
      - full_name
      type: object
    ValidationProblem:
      additionalProperties: false
      description: Problema con errores por campo (422 y algunos 400)
      properties:
        code:
          description: Código estable y traducible por el frontend (i18n)
          example: resource.not_found
          type: string
        detail:
          description: Explicación específica, solo cuando el error la define
          type: string
        errors:
          items:
            "$ref": "#/components/schemas/FieldError"
          type: array
        instance:
          description: Ruta de la petición
          example: "/api/v1/organizations/0198f0a0-0000-7000-8000-000000000000"
          type: string
        request_id:
          description: Mismo valor que la cabecera X-Request-Id; sirve para buscar el detalle en el log
          type: string
        status:
          description: Código HTTP, repetido en el cuerpo
          example: 404
          type: integer
        title:
          description: Resumen legible, en el idioma de la API
          example: No se encontró el recurso
          type: string
        type:
          description: URN estable del tipo de problema
          example: urn:ceiba:error:resource.not_found
          type: string
      required:
      - type
      - title
      - status
      - code
      - instance
      - request_id
      - errors
      type: object
  securitySchemes:
    cookieAuth:
      description: Cookie de sesión (HttpOnly) que entrega POST /auth/login. En producción se llama `__Host-ceiba_session`. Las mutaciones exigen además `X-CSRF-Token` (el de `csrf_token`) y, si el navegador envía `Origin`, que sea el propio.
      in: cookie
      name: ceiba_session
      type: apiKey
info:
  description: Contrato de la API v1. Generado por los specs de rswag; no se edita a mano (docs/architecture/07-api-contract.md).
  title: Ceiba API
  version: v1
openapi: 3.0.3
paths:
  "/api/v1/auth/login":
    post:
      description: Correo y contraseña. Entrega la cookie de sesión (`HttpOnly`, `SameSite=Lax`, `Secure` en producción) y el token CSRF. Un correo inexistente y una contraseña errónea dan EXACTAMENTE la misma respuesta.
      parameters:
      - description: Lo envía el navegador; si está presente debe ser el origen propio
        in: header
        name: Origin
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              properties:
                email:
                  format: email
                  type: string
                password:
                  format: password
                  type: string
              required:
              - email
              - password
              type: object
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  data:
                    "$ref": "#/components/schemas/AuthSession"
                required:
                - data
                type: object
          description: sesión iniciada
        '400':
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/ValidationProblem"
          description: faltan el correo o la contraseña
        '401':
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
          description: credenciales inválidas (código `auth.invalid_credentials`)
        '403':
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
          description: "`Origin` que no es el propio (código `auth.origin_forbidden`); frena el login CSRF"
        '415':
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
          description: el cuerpo no es `application/json` (código `request.unsupported_media_type`)
      summary: Inicia sesión
      tags:
      - Autenticación
  "/api/v1/auth/logout":
    delete:
      description: Revoca la sesión del navegador y borra la cookie. Las demás sesiones del usuario siguen vigentes.
      parameters:
      - description: "`csrf_token` de la sesión (login o GET /auth/session)"
        in: header
        name: X-CSRF-Token
        required: true
        schema:
          type: string
      responses:
        '204':
          description: sesión cerrada
        '401':
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
          description: sin sesión válida
        '403':
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
          description: sesión válida sin token CSRF correcto (`auth.csrf_invalid`) o con `Origin` ajeno (`auth.origin_forbidden`)
      security:
      - cookieAuth: []
      summary: Cierra la sesión actual
      tags:
      - Autenticación
  "/api/v1/auth/session":
    get:
      description: Quién es el usuario autenticado y su token CSRF. La SPA lo llama al arrancar para recuperar el token.
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  data:
                    "$ref": "#/components/schemas/AuthSession"
                required:
                - data
                type: object
          description: la sesión vigente
        '401':
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
          description: sin sesión válida (ausente, vencida o revocada; código `auth.unauthenticated`)
      security:
      - cookieAuth: []
      summary: Sesión actual
      tags:
      - Autenticación
  "/api/v1/auth/sessions":
    delete:
      description: Revoca todas las sesiones del usuario, en todos los dispositivos.
      parameters:
      - description: "`csrf_token` de la sesión (login o GET /auth/session)"
        in: header
        name: X-CSRF-Token
        required: true
        schema:
          type: string
      responses:
        '204':
          description: todas las sesiones revocadas
        '401':
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
          description: sin sesión válida
        '403':
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
          description: sesión válida sin token CSRF correcto (`auth.csrf_invalid`) o con `Origin` ajeno (`auth.origin_forbidden`)
      security:
      - cookieAuth: []
      summary: Cierra todas las sesiones
      tags:
      - Autenticación
  "/api/v1/organizations":
    get:
      description: Las organizaciones donde el usuario autenticado tiene algún membership (selector de contexto, ADR-0028). Incluye las suspendidas, con su `status`.
      parameters:
      - in: query
        name: limit
        required: false
        schema:
          maximum: 100
          minimum: 1
          type: integer
      - description: Cursor opaco de la página anterior
        in: query
        name: after
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  data:
                    items:
                      "$ref": "#/components/schemas/OrganizationSummary"
                    type: array
                  page:
                    "$ref": "#/components/schemas/PageInfo"
                required:
                - data
                - page
                type: object
          description: las organizaciones del usuario
        '401':
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
          description: sin sesión válida
      security:
      - cookieAuth: []
      summary: Lista las organizaciones del usuario
      tags:
      - Organizaciones
  "/api/v1/organizations/{id}":
    get:
      description: Exige el permiso `platform.organization.read` (org_owner y org_admin). Una organización donde el usuario no tiene membership responde 404, igual que una inexistente.
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  data:
                    "$ref": "#/components/schemas/Organization"
                required:
                - data
                type: object
          description: la organización
        '401':
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
          description: sin sesión válida
        '403':
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
          description: miembro de la organización sin el permiso, o la organización está suspendida (`access.forbidden`, `access.organization_suspended`)
        '404':
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
          description: no existe, no es un UUID o el usuario no pertenece a ella
      security:
      - cookieAuth: []
      summary: Obtiene una organización
      tags:
      - Organizaciones
    parameters:
    - description: ID de la organización (UUIDv7)
      in: path
      name: id
      required: true
      schema:
        format: uuid
        type: string
  "/api/v1/organizations/{organization_id}/companies":
    get:
      description: Solo las empresas donde el usuario tiene `platform.company.read` (org_owner y org_admin, todas; company_manager, la suya).
      parameters:
      - in: query
        name: limit
        required: false
        schema:
          maximum: 100
          minimum: 1
          type: integer
      - in: query
        name: after
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  data:
                    items:
                      "$ref": "#/components/schemas/Company"
                    type: array
                  page:
                    "$ref": "#/components/schemas/PageInfo"
                required:
                - data
                - page
                type: object
          description: las empresas visibles
        '401':
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
          description: sin sesión válida
        '403':
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
          description: organización suspendida (`access.organization_suspended`)
        '404':
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
          description: la organización no existe o el usuario no pertenece a ella
      security:
      - cookieAuth: []
      summary: Lista las empresas que el usuario puede ver
      tags:
      - Empresas
    parameters:
    - in: path
      name: organization_id
      required: true
      schema:
        format: uuid
        type: string
  "/api/v1/organizations/{organization_id}/companies/{company_id}/branches":
    get:
      description: 'Solo las sucursales donde el usuario tiene `platform.branch.read`: un company_manager ve todas las de su empresa; un branch_manager, la suya.'
      parameters:
      - in: query
        name: limit
        required: false
        schema:
          maximum: 100
          minimum: 1
          type: integer
      - in: query
        name: after
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  data:
                    items:
                      "$ref": "#/components/schemas/Branch"
                    type: array
                  page:
                    "$ref": "#/components/schemas/PageInfo"
                required:
                - data
                - page
                type: object
          description: las sucursales visibles
        '401':
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
          description: sin sesión válida
        '404':
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
          description: la empresa está fuera del alcance del usuario
      security:
      - cookieAuth: []
      summary: Lista las sucursales de una empresa que el usuario puede ver
      tags:
      - Sucursales
    parameters:
    - in: path
      name: organization_id
      required: true
      schema:
        format: uuid
        type: string
    - in: path
      name: company_id
      required: true
      schema:
        format: uuid
        type: string
  "/api/v1/organizations/{organization_id}/companies/{company_id}/branches/{id}":
    get:
      description: Exige `platform.branch.read`. Una sucursal fuera del alcance del usuario (p. ej. la hermana de la suya) responde 404.
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  data:
                    "$ref": "#/components/schemas/Branch"
                required:
                - data
                type: object
          description: la sucursal
        '401':
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
          description: sin sesión válida
        '403':
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
          description: visible pero sin permiso (`access.forbidden`)
        '404':
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
          description: la sucursal no existe o está fuera del alcance del usuario
      security:
      - cookieAuth: []
      summary: Obtiene una sucursal
      tags:
      - Sucursales
    parameters:
    - in: path
      name: organization_id
      required: true
      schema:
        format: uuid
        type: string
    - in: path
      name: company_id
      required: true
      schema:
        format: uuid
        type: string
    - description: ID de la sucursal
      in: path
      name: id
      required: true
      schema:
        format: uuid
        type: string
  "/api/v1/organizations/{organization_id}/companies/{id}":
    get:
      description: Exige `platform.company.read`. Una empresa fuera del alcance de los memberships del usuario responde 404.
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  data:
                    "$ref": "#/components/schemas/Company"
                required:
                - data
                type: object
          description: la empresa
        '401':
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
          description: sin sesión válida
        '403':
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
          description: visible por una sucursal, pero sin permiso sobre la empresa (`access.forbidden`)
        '404':
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
          description: la empresa no existe o está fuera del alcance del usuario
      security:
      - cookieAuth: []
      summary: Obtiene una empresa
      tags:
      - Empresas
    parameters:
    - in: path
      name: organization_id
      required: true
      schema:
        format: uuid
        type: string
    - description: ID de la empresa
      in: path
      name: id
      required: true
      schema:
        format: uuid
        type: string
servers:
- description: Mismo origen (ADR-0013)
  url: "/"
