      parameters:
      - description: "`csrf_token` de la sesión (login o GET /auth/session)"
        in: header
        name: X-CSRF-Token
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                enabled:
                  type: boolean
              required:
              - enabled
              type: object
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ModuleActivation"
          description: desactivar (y repetir no cambia nada)
        '400':
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/ValidationProblem"
          description: falta `enabled`
