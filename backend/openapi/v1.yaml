---
components:
  headers:
    IdempotencyReplayed:
      description: "`true` cuando la respuesta es la guardada de una petición anterior con la misma `Idempotency-Key` (repetida, no ejecutada de nuevo)."
      schema:
        enum:
        - 'true'
        type: string
  parameters:
    IdempotencyKey:
      description: 'Clave única (p. ej. un UUID) que hace seguro reintentar la creación: misma clave y mismo cuerpo repiten la respuesta (cabecera `Idempotency-Replayed: true`) y no crean otro recurso; la misma clave con otro método, ruta o cuerpo da `409 idempotency.key_reused`. Vale 24 horas, por organización y principal.'
      in: header
      name: Idempotency-Key
      required: false
      schema:
        example: '0198f0a0-7c3e-7000-8000-5b1f0c2d9e11'
        maxLength: 255
        minLength: 1
        pattern: "^[!-~]+$"
        type: string
    IdempotencyKeyRequired:
      description: 'Clave única (p. ej. un UUID) que hace seguro reintentar la creación: misma clave y mismo cuerpo repiten la respuesta (cabecera `Idempotency-Replayed: true`) y no crean otro recurso; la misma clave con otro método, ruta o cuerpo da `409 idempotency.key_reused`. Vale 24 horas, por organización y principal.'
      in: header
      name: Idempotency-Key
      required: true
      schema:
        example: '0198f0a0-7c3e-7000-8000-5b1f0c2d9e11'
        maxLength: 255
        minLength: 1
        pattern: "^[!-~]+$"
        type: string
  responses:
    IdempotencyKeyInvalid:
      content:
        application/problem+json:
          schema:
            "$ref": "#/components/schemas/Problem"
      description: "`Idempotency-Key` inválida (`idempotency.key_invalid`) o ausente en un endpoint que la exige (`idempotency.key_required`)"
    IdempotencyKeyReused:
      content:
        application/problem+json:
          schema:
            "$ref": "#/components/schemas/Problem"
      description: La `Idempotency-Key` ya se usó con otro método, ruta o cuerpo (código `idempotency.key_reused`)
    IdempotencyRequestInProgress:
      content:
        application/problem+json:
          schema:
            "$ref": "#/components/schemas/Problem"
      description: Otra petición con la misma `Idempotency-Key` sigue en curso (código `idempotency.request_in_progress`); reintenta con la misma clave
  schemas:
    AuthSession:
      additionalProperties: false
      description: 'Sesión del panel: quién es y el token CSRF que debe enviar en `X-CSRF-Token` en toda mutación'
      properties:
        csrf_token:
          description: Ligado a esta sesión; cambia cuando la sesión rota (login). Se guarda en memoria, no en almacenamiento persistente
          type: string
        expires_at:
          description: Caducidad ABSOLUTA de la sesión (UTC); la inactividad de 12 h es aparte
          format: date-time
          type: string
        user:
          "$ref": "#/components/schemas/User"
      required:
      - user
      - csrf_token
      - expires_at
      type: object
    AvailabilityPrice:
      additionalProperties: false
      description: 'Precio total de los servicios pedidos en la sucursal (con sus overrides): entero en unidades menores y moneda.'
      properties:
        amount_minor:
          example: 25000
          format: int64
          minimum: 0
          type: integer
        currency:
          example: NIO
          type: string
      required:
      - amount_minor
      - currency
      type: object
    AvailabilitySlot:
      additionalProperties: false
      description: Un inicio posible para los servicios y su fin (inicio + duración efectiva total). Instantes UTC. `professional_id` es quien atiende (el asignado si se pidió `any`) y `resource_id` el recurso reservado, o nulo si los servicios no piden recurso.
      properties:
        ends_at:
          description: UTC
          format: date-time
          type: string
        professional_id:
          format: uuid
          type: string
        resource_id:
          format: uuid
          nullable: true
          type: string
        starts_at:
          description: UTC
          format: date-time
          type: string
      required:
      - starts_at
      - ends_at
      - professional_id
      - resource_id
      type: object
    Branch:
      additionalProperties: false
      description: 'Sucursal: una ubicación de una empresa'
      properties:
        address:
          nullable: true
          type: string
        company_id:
          format: uuid
          type: string
        created_at:
          description: UTC
          format: date-time
          type: string
        id:
          format: uuid
          type: string
        name:
          type: string
        phone_e164:
          example: "+50588887777"
          nullable: true
          type: string
        status:
          enum:
          - active
          - inactive
          type: string
        time_zone:
          description: Zona horaria IANA
          example: America/Managua
          type: string
        updated_at:
          description: UTC
          format: date-time
          type: string
      required:
      - id
      - company_id
      - name
      - time_zone
      - address
      - phone_e164
      - status
      - created_at
      - updated_at
      type: object
    Company:
      additionalProperties: false
      description: 'Empresa: un negocio dentro de una organización (ADR-0004)'
      properties:
        business_type:
          example: barbershop
          type: string
        created_at:
          description: UTC
          format: date-time
          type: string
        currency:
          enum:
          - NIO
          - USD
          type: string
        id:
          format: uuid
          type: string
        locale:
          example: es-NI
          type: string
        name:
          type: string
        slug:
          description: Único en toda la plataforma (URL pública /c/:slug)
          example: barberia-guegu
          type: string
        status:
          enum:
          - active
          - inactive
          type: string
        updated_at:
          description: UTC
          format: date-time
          type: string
      required:
      - id
      - name
      - slug
      - business_type
      - currency
      - locale
      - status
      - created_at
      - updated_at
      type: object
    Customer:
      additionalProperties: false
      description: Cliente de una empresa. El teléfono, el correo y las notas solo salen por los endpoints de clientes (`platform.customer.read`).
      properties:
        archived_at:
          description: UTC; null si está activo
          format: date-time
          nullable: true
          type: string
        created_at:
          description: UTC
          format: date-time
          type: string
        email:
          nullable: true
          type: string
        full_name:
          type: string
        id:
          format: uuid
          type: string
        notes:
          nullable: true
          type: string
        phone_e164:
          description: Teléfono en E.164, único por empresa
          example: "+50588887777"
          type: string
        updated_at:
          description: UTC
          format: date-time
          type: string
      required:
      - id
      - full_name
      - phone_e164
      - email
      - notes
      - archived_at
      - created_at
      - updated_at
      type: object
    CustomerInput:
      additionalProperties: false
      description: Alta de un cliente
      properties:
        email:
          maxLength: 254
          nullable: true
          type: string
        full_name:
          maxLength: 200
          type: string
        notes:
          maxLength: 2000
          nullable: true
          type: string
        phone_e164:
          description: En cualquier formato; se normaliza a E.164 con el país de la organización
          example: 8888-7777
          type: string
      required:
      - full_name
      - phone_e164
      type: object
    CustomerPatch:
      additionalProperties: false
      description: 'Edición parcial de un cliente: solo cambian los campos enviados'
      properties:
        email:
          maxLength: 254
          nullable: true
          type: string
        full_name:
          maxLength: 200
          type: string
        notes:
          maxLength: 2000
          nullable: true
          type: string
        phone_e164:
          description: En cualquier formato; se normaliza a E.164
          example: 8888-7777
          type: string
      type: object
    FieldError:
      additionalProperties: false
      properties:
        code:
          description: Tipo del error (blank, taken, invalid...)
          example: blank
          type: string
        field:
          example: company.slug
          type: string
        message:
          example: no puede estar en blanco
          type: string
      required:
      - field
      - code
      - message
      type: object
    Me:
      additionalProperties: false
      description: Respuesta de GET /api/v1/me
      properties:
        data:
          additionalProperties: false
          properties:
            context:
              additionalProperties: false
              description: Lo elegido; cada nivel es null si no hay (usuario sin memberships, sin sucursal elegida)
              properties:
                branch:
                  allOf:
                  - "$ref": "#/components/schemas/Branch"
                  nullable: true
                company:
                  allOf:
                  - "$ref": "#/components/schemas/Company"
                  nullable: true
                organization:
                  allOf:
                  - "$ref": "#/components/schemas/OrganizationSummary"
                  nullable: true
              required:
              - organization
              - company
              - branch
              type: object
            modules:
              description: Módulos ACTIVOS en la empresa del contexto, con los settings resueltos (default -> empresa -> sucursal)
              items:
                additionalProperties: false
                properties:
                  key:
                    example: appointments
                    type: string
                  settings:
                    additionalProperties: true
                    type: object
                  version:
                    example: '1.0'
                    type: string
                required:
                - key
                - version
                - settings
                type: object
              type: array
            navigation:
              items:
                additionalProperties: false
                properties:
                  key:
                    type: string
                  module:
                    type: string
                  path:
                    example: "/agenda"
                    type: string
                required:
                - module
                - key
                - path
                type: object
              type: array
            permissions:
              description: Permisos que el usuario ejerce en el contexto, de los módulos activos y de la plataforma. El frontend los refleja; no decide.
              items:
                type: string
              type: array
            principal:
              additionalProperties: false
              properties:
                email:
                  type: string
                id:
                  format: uuid
                  type: string
                name:
                  type: string
              required:
              - id
              - name
              - email
              type: object
          required:
          - principal
          - context
          - modules
          - permissions
          - navigation
          type: object
      required:
      - data
      type: object
    ModuleActivation:
      additionalProperties: false
      properties:
        data:
          additionalProperties: false
          properties:
            changed:
              description: false si la llamada fue una repetición
              type: boolean
            enabled:
              type: boolean
            key:
              type: string
          required:
          - key
          - enabled
          - changed
          type: object
      required:
      - data
      type: object
    ModuleSettings:
      additionalProperties: false
      properties:
        data:
          additionalProperties: false
          properties:
            key:
              type: string
            settings:
              additionalProperties: true
              description: Settings resueltos del nivel escrito (default -> empresa -> sucursal)
              type: object
          required:
          - key
          - settings
          type: object
      required:
      - data
      type: object
    Organization:
      additionalProperties: false
      description: 'Organización: el tenant (ADR-0003)'
      properties:
        country_code:
          description: ISO 3166-1 alfa-2
          example: NI
          type: string
        created_at:
          description: UTC
          format: date-time
          type: string
        id:
          format: uuid
          type: string
        legal_name:
          nullable: true
          type: string
        name:
          type: string
        status:
          enum:
          - active
          - suspended
          type: string
        updated_at:
          description: UTC
          format: date-time
          type: string
      required:
      - id
      - name
      - legal_name
      - country_code
      - status
      - created_at
      - updated_at
      type: object
    OrganizationSummary:
      additionalProperties: false
      description: Resumen de una organización para el selector de contexto (id, nombre, estado)
      properties:
        id:
          format: uuid
          type: string
        name:
          type: string
        status:
          enum:
          - active
          - suspended
          type: string
      required:
      - id
      - name
      - status
      type: object
    PageInfo:
      additionalProperties: false
      description: Metadatos de la paginación por cursor
      properties:
        has_more:
          type: boolean
        next_cursor:
          description: Cursor opaco para pedir la siguiente página (?after=); null en la última
          nullable: true
          type: string
      required:
      - next_cursor
      - has_more
      type: object
    Problem:
      additionalProperties: false
      description: application/problem+json (RFC 9457)
      properties:
        code:
          description: Código estable y traducible por el frontend (i18n)
          example: resource.not_found
          type: string
        detail:
          description: Explicación específica, solo cuando el error la define
          type: string
        instance:
          description: Ruta de la petición
          example: "/api/v1/organizations/0198f0a0-0000-7000-8000-000000000000"
          type: string
        request_id:
          description: Mismo valor que la cabecera X-Request-Id; sirve para buscar el detalle en el log
          type: string
        status:
          description: Código HTTP, repetido en el cuerpo
          example: 404
          type: integer
        title:
          description: Resumen legible, en el idioma de la API
          example: No se encontró el recurso
          type: string
        type:
          description: URN estable del tipo de problema
          example: urn:ceiba:error:resource.not_found
          type: string
      required:
      - type
      - title
      - status
      - code
      - instance
      - request_id
      type: object
    Professional:
      additionalProperties: false
      description: 'Profesional de una empresa. Una misma persona (`user_id`) puede tener un registro en cada empresa del grupo, con su propio horario. No trae datos de la persona vinculada: solo su identificador.'
      properties:
        active:
          type: boolean
        archived_at:
          description: UTC; null si no está archivado
          format: date-time
          nullable: true
          type: string
        branch_ids:
          description: Sucursales de la empresa donde está asignado
          items:
            format: uuid
            type: string
          type: array
        created_at:
          description: UTC
          format: date-time
          type: string
        display_name:
          maxLength: 120
          type: string
        id:
          format: uuid
          type: string
        service_ids:
          description: Servicios que presta
          items:
            format: uuid
            type: string
          type: array
        updated_at:
          description: UTC
          format: date-time
          type: string
        user_id:
          description: Persona vinculada; null si el profesional no tiene usuario
          format: uuid
          nullable: true
          type: string
      required:
      - id
      - display_name
      - user_id
      - active
      - archived_at
      - branch_ids
      - service_ids
      - created_at
      - updated_at
      type: object
    ProfessionalInput:
      additionalProperties: false
      description: Alta de un profesional. `user_id` debe tener una membresía en la organización y no estar ya vinculado a otro profesional de la empresa.
      properties:
        active:
          default: true
          type: boolean
        display_name:
          maxLength: 120
          minLength: 1
          type: string
        user_id:
          format: uuid
          nullable: true
          type: string
      required:
      - display_name
      type: object
    ProfessionalPatch:
      additionalProperties: false
      description: 'Edición parcial de un profesional: solo cambian los campos enviados; `user_id: null` desvincula a la persona'
      properties:
        active:
          type: boolean
        display_name:
          maxLength: 120
          minLength: 1
          type: string
        user_id:
          format: uuid
          nullable: true
          type: string
      type: object
    ProfessionalServicesInput:
      additionalProperties: false
      description: El conjunto completo de servicios que presta el profesional; lo que no viene se quita
      properties:
        service_ids:
          items:
            format: uuid
            type: string
          type: array
          uniqueItems: true
      required:
      - service_ids
      type: object
    Resource:
      additionalProperties: false
      description: Recurso físico de una sucursal (sillón, sala, equipo).
      properties:
        active:
          type: boolean
        archived_at:
          description: UTC; null si no está archivado
          format: date-time
          nullable: true
          type: string
        branch_id:
          format: uuid
          type: string
        created_at:
          description: UTC
          format: date-time
          type: string
        id:
          format: uuid
          type: string
        kind:
          enum:
          - chair
          - room
          - equipment
          type: string
        name:
          maxLength: 120
          type: string
        updated_at:
          description: UTC
          format: date-time
          type: string
      required:
      - id
      - branch_id
      - name
      - kind
      - active
      - archived_at
      - created_at
      - updated_at
      type: object
    ResourceInput:
      additionalProperties: false
      description: Alta de un recurso en la sucursal de la ruta.
      properties:
        active:
          default: true
          type: boolean
        kind:
          enum:
          - chair
          - room
          - equipment
          type: string
        name:
          maxLength: 120
          minLength: 1
          type: string
      required:
      - name
      - kind
      type: object
    ResourcePatch:
      additionalProperties: false
      description: 'Edición parcial de un recurso: solo cambian los campos enviados'
      properties:
        active:
          type: boolean
        kind:
          enum:
          - chair
          - room
          - equipment
          type: string
        name:
          maxLength: 120
          minLength: 1
          type: string
      type: object
    Service:
      additionalProperties: false
      description: Servicio del catálogo de una empresa. El precio es un entero en unidades menores (`price_minor`) en la moneda de la empresa.
      properties:
        active:
          type: boolean
        archived_at:
          description: UTC; null si no está archivado
          format: date-time
          nullable: true
          type: string
        buffer_after_minutes:
          maximum: 1440
          minimum: 0
          type: integer
        buffer_before_minutes:
          maximum: 1440
          minimum: 0
          type: integer
        created_at:
          description: UTC
          format: date-time
          type: string
        currency:
          description: Siempre la moneda de la empresa
          enum:
          - NIO
          - USD
          type: string
        duration_minutes:
          maximum: 1440
          minimum: 1
          type: integer
        id:
          format: uuid
          type: string
        name:
          type: string
        position:
          description: Orden en el catálogo (menor primero)
          minimum: 0
          type: integer
        price_minor:
          description: Precio en unidades menores (centavos)
          example: 20000
          format: int64
          maximum: 9007199254740991
          minimum: 0
          type: integer
        updated_at:
          description: UTC
          format: date-time
          type: string
      required:
      - id
      - name
      - duration_minutes
      - buffer_before_minutes
      - buffer_after_minutes
      - price_minor
      - currency
      - active
      - position
      - archived_at
      - created_at
      - updated_at
      type: object
    ServiceInput:
      additionalProperties: false
      description: Alta de un servicio. Sin `currency` toma la de la empresa; si se envía debe ser la de la empresa (si no, 422).
      properties:
        active:
          default: true
          type: boolean
        buffer_after_minutes:
          default: 0
          maximum: 1440
          minimum: 0
          type: integer
        buffer_before_minutes:
          default: 0
          maximum: 1440
          minimum: 0
          type: integer
        currency:
          enum:
          - NIO
          - USD
          type: string
        duration_minutes:
          maximum: 1440
          minimum: 1
          type: integer
        name:
          maxLength: 200
          type: string
        position:
          default: 0
          minimum: 0
          type: integer
        price_minor:
          example: 20000
          format: int64
          maximum: 9007199254740991
          minimum: 0
          type: integer
      required:
      - name
      - duration_minutes
      - price_minor
      type: object
    ServiceOverride:
      additionalProperties: false
      description: Duración y/o precio propios de una sucursal para un servicio. Un valor null significa que la sucursal usa el del servicio.
      properties:
        branch_id:
          format: uuid
          type: string
        created_at:
          description: UTC
          format: date-time
          type: string
        currency:
          description: 'La del servicio: el override no tiene moneda propia'
          enum:
          - NIO
          - USD
          type: string
        duration_minutes:
          maximum: 1440
          minimum: 1
          nullable: true
          type: integer
        id:
          format: uuid
          type: string
        price_minor:
          format: int64
          minimum: 0
          nullable: true
          type: integer
        service_id:
          format: uuid
          type: string
        updated_at:
          description: UTC
          format: date-time
          type: string
      required:
      - id
      - branch_id
      - service_id
      - duration_minutes
      - price_minor
      - currency
      - created_at
      - updated_at
      type: object
    ServiceOverrideInput:
      additionalProperties: false
      description: Cambio de un override. Cambia SOLO los campos enviados; lo que no viene se conserva. Un `null` explícito quita ese valor. El resultado debe tener al menos uno de los dos (para quitarlo todo, `DELETE`).
      properties:
        duration_minutes:
          maximum: 1440
          minimum: 1
          nullable: true
          type: integer
        price_minor:
          format: int64
          minimum: 0
          nullable: true
          type: integer
      type: object
    ServicePatch:
      additionalProperties: false
      description: 'Edición parcial de un servicio: solo cambian los campos enviados'
      properties:
        active:
          type: boolean
        buffer_after_minutes:
          maximum: 1440
          minimum: 0
          type: integer
        buffer_before_minutes:
          maximum: 1440
          minimum: 0
          type: integer
        currency:
          enum:
          - NIO
          - USD
          type: string
        duration_minutes:
          maximum: 1440
          minimum: 1
          type: integer
        name:
          maxLength: 200
          type: string
        position:
          minimum: 0
          type: integer
        price_minor:
          format: int64
          maximum: 9007199254740991
          minimum: 0
          type: integer
      type: object
    ServiceResourceRequirements:
      additionalProperties: false
      description: 'Los tipos de recurso que necesita un servicio: el hueco de agenda exige un recurso compatible de cada tipo en la sucursal.'
      properties:
        kinds:
          items:
            enum:
            - chair
            - room
            - equipment
            type: string
          type: array
          uniqueItems: true
        service_id:
          format: uuid
          type: string
      required:
      - service_id
      - kinds
      type: object
    ServiceResourceRequirementsInput:
      additionalProperties: false
      description: El conjunto completo de tipos de recurso que necesita el servicio; lo que no viene se quita
      properties:
        kinds:
          items:
            enum:
            - chair
            - room
            - equipment
            type: string
          type: array
          uniqueItems: true
      required:
      - kinds
      type: object
    TimeOff:
      additionalProperties: false
      description: Ausencia de un profesional o de un recurso (exactamente uno de `professional_id` y `resource_id`).
      properties:
        created_at:
          description: UTC
          format: date-time
          type: string
        ends_at:
          description: UTC
          format: date-time
          type: string
        id:
          format: uuid
          type: string
        professional_id:
          format: uuid
          nullable: true
          type: string
        reason:
          description: Texto libre opcional; sin datos de salud
          maxLength: 200
          nullable: true
          type: string
        resource_id:
          format: uuid
          nullable: true
          type: string
        starts_at:
          description: UTC
          format: date-time
          type: string
      required:
      - id
      - professional_id
      - resource_id
      - starts_at
      - ends_at
      - reason
      - created_at
      type: object
    TimeOffInput:
      additionalProperties: false
      description: 'Alta de una ausencia: `starts_at` antes que `ends_at`, hasta 366 días. El dueño es el de la ruta.'
      properties:
        ends_at:
          format: date-time
          type: string
        reason:
          description: Texto libre opcional; sin datos de salud. No se registra en logs ni en la auditoría
          maxLength: 200
          nullable: true
          type: string
        starts_at:
          format: date-time
          type: string
      required:
      - starts_at
      - ends_at
      type: object
    User:
      additionalProperties: false
      description: 'Persona autenticada. Global: no pertenece a una organización (ADR-0028)'
      properties:
        email:
          description: 'Normalizado: minúsculas y sin espacios'
          format: email
          type: string
        full_name:
          type: string
        id:
          format: uuid
          type: string
      required:
      - id
      - email
      - full_name
      type: object
    ValidationProblem:
      additionalProperties: false
      description: Problema con errores por campo (422 y algunos 400)
      properties:
        code:
          description: Código estable y traducible por el frontend (i18n)
          example: resource.not_found
          type: string
        detail:
          description: Explicación específica, solo cuando el error la define
          type: string
        errors:
          items:
            "$ref": "#/components/schemas/FieldError"
          type: array
        instance:
          description: Ruta de la petición
          example: "/api/v1/organizations/0198f0a0-0000-7000-8000-000000000000"
          type: string
        request_id:
          description: Mismo valor que la cabecera X-Request-Id; sirve para buscar el detalle en el log
          type: string
        status:
          description: Código HTTP, repetido en el cuerpo
          example: 404
          type: integer
        title:
          description: Resumen legible, en el idioma de la API
          example: No se encontró el recurso
          type: string
        type:
          description: URN estable del tipo de problema
          example: urn:ceiba:error:resource.not_found
          type: string
      required:
      - type
      - title
      - status
      - code
      - instance
      - request_id
      - errors
      type: object
    WeeklyScheduleInput:
      additionalProperties: false
      description: 'El horario completo del dueño en la sucursal: reemplaza todas sus franjas. Horas `HH:MM` (minutos enteros), inicio antes que fin, sin cruzar la medianoche.'
      properties:
        slots:
          items:
            additionalProperties: false
            properties:
              ends_at_local:
                example: '13:00'
                type: string
              starts_at_local:
                example: '09:00'
                type: string
              weekday:
                maximum: 6
                minimum: 0
                type: integer
            required:
            - weekday
            - starts_at_local
            - ends_at_local
            type: object
          maxItems: 100
          type: array
      required:
      - slots
      type: object
    WeeklyScheduleSlot:
      additionalProperties: false
      description: Una franja semanal en hora LOCAL de la sucursal (sin zona; la zona es de la sucursal).
      properties:
        ends_at_local:
          example: '13:00'
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
          type: string
        id:
          format: uuid
          type: string
        starts_at_local:
          example: '09:00'
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
          type: string
        weekday:
          description: 0 = domingo, como `Date#wday`
          maximum: 6
          minimum: 0
          type: integer
      required:
      - id
      - weekday
      - starts_at_local
      - ends_at_local
      type: object
  securitySchemes:
    cookieAuth:
      description: Cookie de sesión (HttpOnly) que entrega POST /auth/login. En producción se llama `__Host-ceiba_session`. Las mutaciones exigen además `X-CSRF-Token` (el de `csrf_token`) y, si el navegador envía `Origin`, que sea el propio.
      in: cookie
      name: ceiba_session
      type: apiKey
info:
  description: Contrato de la API v1. Generado por los specs de rswag; no se edita a mano (docs/architecture/07-api-contract.md).
  title: Ceiba API
  version: v1
openapi: 3.0.3
paths:
  "/api/public/v1/c/{slug}/availability":
    get:
      description: 'Superficie ANÓNIMA: sin sesión ni CSRF. Devuelve los inicios libres (UTC) de uno o varios servicios con un profesional o con `any`, con `professional_id` y `resource_id` asignados y el precio total. No expone nombres ni citas. Rango de hasta 14 días (`from` no anterior a ayer en la hora local de la sucursal). Un slug desconocido, el módulo de citas apagado, la reserva pública apagada (empresa o sucursal), la empresa inactiva, la organización suspendida, una sucursal ajena o inactiva, y un servicio o profesional inexistente, inactivo o que no aplica responden todos el MISMO 404 `resource.not_found`. Las puertas (módulo, empresa, sucursal, reserva pública) se comprueban en cada petición; la respuesta se guarda en caché hasta 30 s, así que un servicio o profesional recién desactivado puede seguir apareciendo ese tiempo y la reserva lo revalida. Está limitada a 60 peticiones por minuto por IP y empresa (429 `rate_limit.exceeded`).'
      parameters:
      - description: Sucursal de la empresa
        in: query
        name: branch_id
        required: true
        schema:
          format: uuid
          type: string
      - description: Servicios, UUID separados por comas (1 a 5, sin repetir); el orden es la secuencia
        in: query
        name: service_ids
        required: true
        schema:
          type: string
      - description: UUID de un profesional de la sucursal o el literal `any`
        in: query
        name: professional_id
        required: true
        schema:
          type: string
      - description: Primer día local (`YYYY-MM-DD`)
        in: query
        name: from
        required: true
        schema:
          format: date
          type: string
      - description: Último día local, inclusivo (`YYYY-MM-DD`)
        in: query
        name: to
        required: true
        schema:
          format: date
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  data:
                    items:
                      "$ref": "#/components/schemas/AvailabilitySlot"
                    type: array
                  meta:
                    additionalProperties: false
                    properties:
                      buffer_after_minutes:
                        type: integer
                      buffer_before_minutes:
                        type: integer
                      duration_minutes:
                        type: integer
                      price:
                        "$ref": "#/components/schemas/AvailabilityPrice"
                      step_minutes:
                        type: integer
                      time_zone:
                        type: string
                    required:
                    - time_zone
                    - duration_minutes
                    - buffer_before_minutes
                    - buffer_after_minutes
                    - price
                    - step_minutes
                    type: object
                required:
                - data
                - meta
                type: object
          description: un rango de exactamente 14 días
        '400':
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/ValidationProblem"
          description: sin `from`
        '404':
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
          description: 'slug desconocido, puerta cerrada o recurso que no aplica: siempre el mismo cuerpo'
        '422':
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/ValidationProblem"
          description: un `from` anterior a ayer
        '429':
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
          description: más de 60 peticiones por minuto desde la misma IP para la misma empresa (rate_limit.exceeded)
          headers:
            RateLimit-Limit:
              description: Peticiones permitidas por ventana
              schema:
                type: integer
            RateLimit-Remaining:
              description: Peticiones restantes en la ventana (0)
              schema:
                type: integer
            RateLimit-Reset:
              description: Segundos hasta el reinicio de la ventana
              schema:
                type: integer
            Retry-After:
              description: Segundos hasta que se abre la ventana siguiente
              schema:
                type: integer
      security: []
      summary: Consulta los horarios libres de una empresa sin sesión
      tags:
      - Disponibilidad pública
    parameters:
    - description: Slug público de la empresa
      in: path
      name: slug
      required: true
      schema:
        pattern: "^[a-z0-9-]{3,40}$"
        type: string
  "/api/v1/auth/login":
    post:
      description: Correo y contraseña. Entrega la cookie de sesión (`HttpOnly`, `SameSite=Lax`, `Secure` en producción) y el token CSRF. Un correo inexistente y una contraseña errónea dan EXACTAMENTE la misma respuesta.
      parameters:
      - description: Lo envía el navegador; si está presente debe ser el origen propio
        in: header
        name: Origin
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              properties:
                email:
                  format: email
                  type: string
                password:
                  format: password
                  type: string
              required:
              - email
              - password
              type: object
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  data:
                    "$ref": "#/components/schemas/AuthSession"
                required:
                - data
                type: object
          description: sesión iniciada
        '400':
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/ValidationProblem"
          description: faltan el correo o la contraseña
        '401':
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
          description: credenciales inválidas (código `auth.invalid_credentials`)
        '403':
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
          description: "`Origin` que no es el propio (código `auth.origin_forbidden`); frena el login CSRF"
        '415':
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
          description: el cuerpo no es `application/json` (código `request.unsupported_media_type`)
      summary: Inicia sesión
      tags:
      - Autenticación
  "/api/v1/auth/logout":
    delete:
      description: Revoca la sesión del navegador y borra la cookie. Las demás sesiones del usuario siguen vigentes.
      parameters:
      - description: "`csrf_token` de la sesión (login o GET /auth/session)"
        in: header
        name: X-CSRF-Token
        required: true
        schema:
          type: string
      responses:
        '204':
          description: sesión cerrada
        '401':
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
          description: sin sesión válida
        '403':
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
          description: sesión válida sin token CSRF correcto (`auth.csrf_invalid`) o con `Origin` ajeno (`auth.origin_forbidden`)
      security:
      - cookieAuth: []
      summary: Cierra la sesión actual
      tags:
      - Autenticación
  "/api/v1/auth/session":
    get:
      description: Quién es el usuario autenticado y su token CSRF. La SPA lo llama al arrancar para recuperar el token.
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  data:
                    "$ref": "#/components/schemas/AuthSession"
                required:
                - data
                type: object
          description: la sesión vigente
        '401':
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
          description: sin sesión válida (ausente, vencida o revocada; código `auth.unauthenticated`)
      security:
      - cookieAuth: []
      summary: Sesión actual
      tags:
      - Autenticación
  "/api/v1/auth/sessions":
    delete:
      description: Revoca todas las sesiones del usuario, en todos los dispositivos.
      parameters:
      - description: "`csrf_token` de la sesión (login o GET /auth/session)"
        in: header
        name: X-CSRF-Token
        required: true
        schema:
          type: string
      responses:
        '204':
          description: todas las sesiones revocadas
        '401':
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
          description: sin sesión válida
        '403':
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
          description: sesión válida sin token CSRF correcto (`auth.csrf_invalid`) o con `Origin` ajeno (`auth.origin_forbidden`)
      security:
      - cookieAuth: []
      summary: Cierra todas las sesiones
      tags:
      - Autenticación
  "/api/v1/me":
    get:
      description: 'El contexto elegido (organización, empresa y sucursal), los módulos ACTIVOS en esa empresa con sus settings resueltos (default del esquema, empresa, sucursal), los permisos que el usuario ejerce ahí y la navegación permitida. El frontend solo lo REFLEJA: ocultar algo no es control de acceso. Sin parámetros usa el último contexto elegido (cookie firmada `ceiba_context`) o, si no hay, la primera organización y empresa que el usuario ve. Un usuario sin memberships recibe el contexto vacío.'
      parameters:
      - description: Requerido si se pasa company_id
        in: query
        name: organization_id
        required: false
        schema:
          format: uuid
          type: string
      - in: query
        name: company_id
        required: false
        schema:
          format: uuid
          type: string
      - description: Requiere company_id
        in: query
        name: branch_id
        required: false
        schema:
          format: uuid
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Me"
          description: el contexto del usuario
        '400':
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/ValidationProblem"
          description: company_id o branch_id sin su organización/empresa
        '401':
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
          description: sin sesión válida
        '403':
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
          description: la organización elegida está suspendida (`access.organization_suspended`)
        '404':
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
          description: la organización, empresa o sucursal no existe o el usuario no la ve
      security:
      - cookieAuth: []
      summary: Contexto del usuario autenticado
      tags:
      - Contexto
  "/api/v1/organizations":
    get:
      description: Las organizaciones donde el usuario autenticado tiene algún membership (selector de contexto, ADR-0028). Incluye las suspendidas, con su `status`.
      parameters:
      - in: query
        name: limit
        required: false
        schema:
          maximum: 100
          minimum: 1
          type: integer
      - description: Cursor opaco de la página anterior
        in: query
        name: after
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  data:
                    items:
                      "$ref": "#/components/schemas/OrganizationSummary"
                    type: array
                  page:
                    "$ref": "#/components/schemas/PageInfo"
                required:
                - data
                - page
                type: object
          description: las organizaciones del usuario
        '401':
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
          description: sin sesión válida
      security:
      - cookieAuth: []
      summary: Lista las organizaciones del usuario
      tags:
      - Organizaciones
  "/api/v1/organizations/{id}":
    get:
      description: Exige el permiso `platform.organization.read` (org_owner y org_admin). Una organización donde el usuario no tiene membership responde 404, igual que una inexistente.
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  data:
                    "$ref": "#/components/schemas/Organization"
                required:
                - data
                type: object
          description: la organización
        '401':
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
          description: sin sesión válida
        '403':
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
          description: miembro de la organización sin el permiso, o la organización está suspendida (`access.forbidden`, `access.organization_suspended`)
        '404':
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
          description: no existe, no es un UUID o el usuario no pertenece a ella
      security:
      - cookieAuth: []
      summary: Obtiene una organización
      tags:
      - Organizaciones
    parameters:
    - description: ID de la organización (UUIDv7)
      in: path
      name: id
      required: true
      schema:
        format: uuid
        type: string
  "/api/v1/organizations/{organization_id}/companies":
    get:
      description: Solo las empresas donde el usuario tiene `platform.company.read` (org_owner y org_admin, todas; company_manager, la suya).
      parameters:
      - in: query
        name: limit
        required: false
        schema:
          maximum: 100
          minimum: 1
          type: integer
      - in: query
        name: after
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  data:
                    items:
                      "$ref": "#/components/schemas/Company"
                    type: array
                  page:
                    "$ref": "#/components/schemas/PageInfo"
                required:
                - data
                - page
                type: object
          description: las empresas visibles
        '401':
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
          description: sin sesión válida
        '403':
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
          description: organización suspendida (`access.organization_suspended`)
        '404':
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
          description: la organización no existe o el usuario no pertenece a ella
      security:
      - cookieAuth: []
      summary: Lista las empresas que el usuario puede ver
      tags:
      - Empresas
    parameters:
    - in: path
      name: organization_id
      required: true
      schema:
        format: uuid
        type: string
  "/api/v1/organizations/{organization_id}/companies/{company_id}/appointments/branches/{branch_id}/availability":
    get:
      description: 'Exige `appointments.appointment.create` en la sucursal (company_manager, branch_manager y receptionist); se comprueba ANTES de validar. `from` y `to` son fechas locales de la sucursal (`YYYY-MM-DD`, inclusivas, `from <= to`, hasta 31 días). `service_ids` son de 1 a 5 servicios de la empresa (404 si alguno no existe), en orden de secuencia; `professional_id` es un profesional asignado a la sucursal o el literal `any`. Devuelve los inicios posibles en la rejilla del reloj local (múltiplos del paso `slot_step_minutes` desde la medianoche local) con la duración efectiva del servicio en la sucursal; los instantes son UTC. La agenda del profesional es única: sus citas y ausencias de otras sucursales también restan, y solo se expone libre/ocupado. Parámetro ausente: 400 `request.invalid`; mal formado: 400 `request.bad_request`; pedido no atendible: 422 `appointments.availability_invalid`.'
      parameters:
      - description: Servicios de la empresa, UUID separados por comas (1 a 5, sin repetir); el orden es la secuencia
        in: query
        name: service_ids
        required: true
        schema:
          type: string
      - description: Profesional asignado a la sucursal
        in: query
        name: professional_id
        required: true
        schema:
          format: uuid
          type: string
      - description: Primer día local (`YYYY-MM-DD`)
        in: query
        name: from
        required: true
        schema:
          format: date
          type: string
      - description: Último día local, inclusivo (`YYYY-MM-DD`)
        in: query
        name: to
        required: true
        schema:
          format: date
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  data:
                    items:
                      "$ref": "#/components/schemas/AvailabilitySlot"
                    type: array
                  meta:
                    additionalProperties: false
                    properties:
                      buffer_after_minutes:
                        type: integer
                      buffer_before_minutes:
                        type: integer
                      duration_minutes:
                        type: integer
                      price:
                        "$ref": "#/components/schemas/AvailabilityPrice"
                      step_minutes:
                        type: integer
                      time_zone:
                        type: string
                    required:
                    - time_zone
                    - duration_minutes
                    - buffer_before_minutes
                    - buffer_after_minutes
                    - price
                    - step_minutes
                    type: object
                required:
                - data
                - meta
                type: object
          description: el company_manager de la empresa
        '400':
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/ValidationProblem"
          description: sin ningún parámetro de consulta
        '401':
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
          description: sin sesión válida
        '403':
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
          description: 'sin permiso, la autorización va ANTES de validar: ni un 400 ni un 404 sobre ids ajenos'
        '404':
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
          description: con el módulo de citas desactivado en la empresa (el gate)
        '422':
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/ValidationProblem"
          description: un servicio que el profesional no presta
      security:
      - cookieAuth: []
      summary: Consulta los horarios libres de uno o varios servicios, con un profesional o con cualquiera
      tags:
      - Disponibilidad
    parameters:
    - in: path
      name: organization_id
      required: true
      schema:
        format: uuid
        type: string
    - in: path
      name: company_id
      required: true
      schema:
        format: uuid
        type: string
    - in: path
      name: branch_id
      required: true
      schema:
        format: uuid
        type: string
  "/api/v1/organizations/{organization_id}/companies/{company_id}/appointments/branches/{branch_id}/professionals/{professional_id}":
    get:
      description: 'Es la ruta del perfil propio del `professional`: exige `appointments.professional.read` en la sucursal, o bien `appointments.professional.read_own` en la sucursal cuando el registro está vinculado a su usuario y asignado a esa sucursal.'
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  data:
                    "$ref": "#/components/schemas/Professional"
                required:
                - data
                type: object
          description: el branch_manager lee cualquier profesional de la empresa desde su sucursal
        '403':
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
          description: el profesional no lee su perfil desde una sucursal donde NO está asignado
        '404':
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
          description: con el módulo de citas desactivado en la empresa (el gate)
      security:
      - cookieAuth: []
      summary: Obtiene un profesional desde una sucursal
      tags:
      - Profesionales
    parameters:
    - in: path
      name: organization_id
      required: true
      schema:
        format: uuid
        type: string
    - in: path
      name: company_id
      required: true
      schema:
        format: uuid
        type: string
    - description: Sucursal desde la que se mira el perfil
      in: path
      name: branch_id
      required: true
      schema:
        format: uuid
        type: string
    - description: ID del profesional
      in: path
      name: professional_id
      required: true
      schema:
        format: uuid
