# Pack modules/appointments (namespace Appointments).
layer: modules
enforce_dependencies: true
enforce_privacy: true
enforce_layers: true
# No other pack may use this module: modules talk to each other only through events.
# The layer checker allows same-layer dependencies, hence the explicit visibility rule.
enforce_visibility: true
visible_to: []

# Declare ONLY what the pack uses. "." is the root pack (ApplicationRecord, ApplicationController...).
# A module depends on platform/ packs, never on another module.
dependencies:
  - "."
  # The company's currency and branches (Tenancy::Directory) and the active context (Tenancy.with_context).
  - "packs/platform/tenancy"
  # Policies extend Access::BasePolicy and ask the principal for permissions.
  - "packs/platform/access"
  # Every catalog write is audited with before/after in the caller's transaction (Audit.record).
  - "packs/platform/audit"
  # Controllers declare Modules::RequiresModule (the module gate).
  - "packs/platform/modules"
  # Creating a service accepts an Idempotency-Key.
  - "packs/platform/idempotency"
