es-NI:
  activerecord:
    errors:
      models:
        appointments/service:
          attributes:
            currency:
              mismatch: "debe ser la moneda de la empresa"
            base:
              archived: "el servicio está archivado y no admite cambios"
        appointments/branch_service_override:
          attributes:
            base:
              archived: "el servicio está archivado y no admite overrides"
        appointments/professional:
          attributes:
            base:
              archived: "el profesional está archivado y no admite cambios"
            user_id:
              immutable: "la persona vinculada no se puede cambiar ni quitar: archive el profesional y cree otro"
        appointments/professional_branch_assignment:
          attributes:
            base:
              archived: "el profesional está archivado y no admite asignaciones nuevas"
        appointments/professional_service:
          attributes:
            service_id:
              archived: "el servicio está archivado y no se puede vincular"
        appointments/resource:
          attributes:
            base:
              archived: "el recurso está archivado y no admite cambios"
        appointments/weekly_schedule:
          attributes:
            base:
              overlap: "la franja se solapa con otra del mismo dueño"
  activemodel:
    errors:
      models:
        appointments/staff/replace_schedule/rejection:
          attributes:
            slots:
              overlap: "hay franjas que se solapan"
              invalid: "hay franjas inválidas (día de 0 a 6, horas de HH:MM con el fin después del inicio y asignadas a la sucursal)"
  api:
    errors:
      appointments:
        availability_invalid: "No se puede calcular la disponibilidad con esos datos"
        slot_unavailable: "El horario ya no está disponible"
        person_unavailable: "La persona ya tiene otra cita a esa hora"
        booking_invalid: "No se puede reservar la cita con esos datos"
        invalid_transition: "La cita no admite ese cambio de estado"
        cancellation_invalid: "No se puede cancelar la cita con esos datos"
        agenda_invalid: "No se puede listar la agenda con esos datos"
  appointments:
    availability:
      errors:
        branch_id:
          inactive: "la sucursal está inactiva"
          wrong_company: "la sucursal no es de la empresa"
        professional_id:
          inactive: "el profesional está pausado o archivado"
          not_assigned: "el profesional no está asignado a la sucursal"
          wrong_company: "el profesional no es de la empresa"
        service_ids:
          blank: "indica al menos un servicio"
          too_many: "se pueden pedir hasta 5 servicios a la vez"
          duplicated: "hay servicios repetidos"
          inactive: "algún servicio está inactivo o archivado"
          not_provided: "el profesional no presta alguno de los servicios"
          multiple_resource_kinds: "los servicios piden más de un tipo de recurso a la vez"
          wrong_company: "algún servicio no es de la empresa"
        from:
          too_early: "`from` no puede ser anterior a ayer en la hora local de la sucursal"
        to:
          invalid_range: "el rango debe ir de `from` a `to` (sin que `to` sea anterior) y no superar el máximo de días permitido"
    transition:
      errors:
        status:
          not_allowed: "la cita ya no está en un estado que admita ese cambio: actualiza la agenda"
          too_early: "la cita todavía no ha empezado"
    agenda:
      errors:
        to:
          before_from: "la fecha final no puede ser anterior a la inicial"
          too_far: "el rango puede ser de hasta 31 días"
          too_many_appointments: "hay demasiadas citas en el rango: pide menos días"
    cancellation:
      errors:
        reason:
          blank: "indica el motivo de la cancelación"
          invalid: "el motivo debe ser customer_request, professional_unavailable, business_decision u other"
    booking:
      errors:
        customer_id:
          invalid: "el cliente no existe, está archivado o no es de la empresa"
        source:
          invalid: "el origen debe ser panel o public_booking"
        notes:
          too_long: "las notas no pueden superar los 500 caracteres"
        starts_at:
          blank: "indica la hora de inicio"
          in_the_past: "la hora de inicio ya pasó"
          not_on_minute: "la hora de inicio debe caer en un minuto exacto, sin segundos ni fracciones"
        professional_id:
          any_not_allowed: "indica un profesional concreto: `any` no se acepta al reservar"
