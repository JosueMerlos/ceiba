# Pack platform/modules (namespace Modules).
layer: platform
enforce_dependencies: true
enforce_privacy: true
enforce_layers: true

# Declare ONLY what the pack uses. "." is the root pack (ApplicationRecord, ApplicationController...).
# A platform pack never depends on a business module.
dependencies:
  - "."
  # The context (Tenancy.with_context, Tenancy::Directory) and the companies a module is enabled on.
  - "packs/platform/tenancy"
  # Manifest permissions are registered in access; access queries back into this pack through the module gate.
  - "packs/platform/access"
  # Enable/Disable publish platform.module_enabled/disabled.v1; the manifest validates that its events have a schema.
  - "packs/platform/events"
  # Enable/Disable/UpdateSettings audit with Audit.record in their own transaction.
  - "packs/platform/audit"
