# Pack platform/access (namespace Access). Reglas: docs/architecture/02-modular-monolith.md
layer: platform
enforce_dependencies: true
enforce_privacy: true
enforce_layers: true

# Declara aquí SOLO lo que el pack usa. "." es el pack raíz (ApplicationRecord, ApplicationController...).
# Un pack de platform no depende de ningún módulo.
dependencies:
  - "."
  # Resolver el contexto desde la ruta (Tenancy.with_context, Tenancy::Directory) y conectar el dueño en la provisión.
  - "packs/platform/tenancy"
  # El dueño de una organización es un Identity::Principal::User (Identity::ProvisionUser).
  - "packs/platform/identity"
  # Los cambios de memberships se auditan en la misma transacción (Audit.record, M0.11).
  - "packs/platform/audit"
