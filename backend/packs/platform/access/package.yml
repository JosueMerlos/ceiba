# Pack platform/access (namespace Access).
layer: platform
enforce_dependencies: true
enforce_privacy: true
enforce_layers: true

# Declare ONLY what the pack uses. "." is the root pack (ApplicationRecord, ApplicationController...).
# A platform pack never depends on a module.
dependencies:
  - "."
  # Resolve the context from the route (Tenancy.with_context, Tenancy::Directory) and hook the owner into provisioning.
  - "packs/platform/tenancy"
  # An organization's owner is an Identity::Principal::User (Identity::ProvisionUser).
  - "packs/platform/identity"
  # Membership changes are audited in the same transaction (Audit.record).
  - "packs/platform/audit"
