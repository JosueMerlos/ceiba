# Base style is rubocop-rails-omakase (Rails 8's); Rails, RSpec and FactoryBot rules are layered on top.
inherit_gem:
  rubocop-rails-omakase: rubocop.yml

# Project-specific cops (lib/rubocop/cop).
require:
  - ./lib/rubocop/cop/ceiba/pack_namespace
  - ./lib/rubocop/cop/ceiba/tenant_bypass
  - ./lib/rubocop/cop/ceiba/access_policy_roles
  - ./lib/rubocop/cop/ceiba/authorization_skips
  - ./lib/rubocop/cop/ceiba/directory_writes
  - ./lib/rubocop/cop/ceiba/module_gate_skips

plugins:
  - rubocop-rails
  - rubocop-rspec
  - rubocop-factory_bot

AllCops:
  NewCops: enable
  TargetRubyVersion: 3.4
  Exclude:
    - "bin/**/*"
    - "tmp/**/*"
    - "vendor/**/*"
    - "node_modules/**/*"

# Specs are written in Spanish: contexts start with these words.
RSpec/ContextWording:
  Prefixes:
    - con
    - sin
    - cuando
    - al
    - si

# Specs describe behavior rather than a single class; the file name follows the class or route.
RSpec/DescribeClass:
  Exclude:
    - "spec/requests/**/*"
    - "spec/api/**/*"
    - "packs/*/*/spec/api/**/*"
    - "spec/config/**/*"
    - "spec/packs/**/*"
    - "packs/platform/modules/spec/**/*"
    - "packs/modules/*/spec/**/*"
    - "spec/db/**/*"
    - "spec/generators/model_generator_spec.rb"
    - "packs/*/*/spec/package_spec.rb"
    - "packs/platform/database/spec/database/**/*"
    - "packs/platform/events/spec/**/*"
    - "packs/platform/audit/spec/**/*"
    - "packs/platform/idempotency/spec/**/*"
    - "packs/platform/tenancy/spec/config/**/*"
    - "packs/platform/tenancy/spec/factories_spec.rb"
    - "packs/platform/tenancy/spec/public_api_spec.rb"
    - "packs/platform/identity/spec/public_api_spec.rb"
    - "packs/platform/identity/spec/public/identity/authenticate_audit_spec.rb"
    - "packs/platform/tenancy/spec/public/**/*"
    - "packs/platform/access/spec/**/*"
    - "spec/platform/**/*"

# Resilience examples (timeouts, hung connections) need several expectations; access-matrix examples check the same
# scope against several resources (own/foreign company, own/sibling branch...).
RSpec/MultipleExpectations:
  Max: 3
  Exclude:
    - "packs/platform/access/spec/**/*"

# Access specs build an organization > companies > branches tree across several organizations: many `let`s with
# domain names (branch_a1) is the readable way to do it.
RSpec/MultipleMemoizedHelpers:
  Exclude:
    - "packs/platform/access/spec/**/*"
RSpec/IndexedLet:
  Exclude:
    - "packs/platform/access/spec/**/*"
RSpec/SpecFilePathFormat:
  Exclude:
    - "packs/platform/access/spec/**/*"

RSpec/ExampleLength:
  Max: 15

# rswag declares examples with `run_test!` and sets up the session with `let!`, which rubocop-rspec does not recognize.
RSpec/EmptyExampleGroup:
  Exclude:
    - "spec/api/**/*"
    - "packs/*/*/spec/api/**/*"

RSpec/LetSetup:
  Exclude:
    - "spec/api/**/*"
    - "packs/*/*/spec/api/**/*"

RSpec/NestedGroups:
  Max: 4

# A file's namespace must start with its pack's name.
Ceiba/PackNamespace:
  Enabled: true
  Include:
    - "packs/*/*/app/**/*.rb"

# Policies ask about permissions, never about roles or admin?.
Ceiba/AccessPolicyRoles:
  Enabled: true
  Include:
    - "packs/*/*/app/policies/**/*.rb"

# Authorization is only skipped with skip_authorization!(reason:, only:); the allowlist is reviewed in an authorization spec.
Ceiba/AuthorizationSkips:
  Enabled: true
  Include:
    - "app/controllers/**/*.rb"
    - "packs/*/*/app/controllers/**/*.rb"

# A controller with `requires_module` cannot skip its gate (ensure_required_module_enabled!): its routes would be open.
Ceiba/ModuleGateSkips:
  Enabled: true
  Include:
    - "app/controllers/**/*.rb"
    - "packs/*/*/app/controllers/**/*.rb"

# Tenancy::Directory is read-only: no update_all/delete_all/readonly(false) through it.
Ceiba/DirectoryWrites:
  Enabled: true
  Include:
    - "app/**/*.rb"
    - "packs/*/*/app/**/*.rb"
    - "lib/**/*.rb"
    - "db/**/*.rb"
  Exclude:
    - "lib/rubocop/**/*"

# Nobody bypasses tenant isolation (ActsAsTenant.without_tenant, unscoped...) outside this list. Every file added here is
# a privileged path and needs review (CODEOWNERS). Tenancy.with_context is the only thing that sets the tenant.
Ceiba/TenantBypass:
  Enabled: true
  Include:
    - "app/**/*.rb"
    - "packs/*/*/app/**/*.rb"
    - "packs/*/*/lib/**/*.rb"
    - "lib/**/*.rb"
    - "db/**/*.rb"
    - "config/**/*.rb"
    - "lib/**/*.rake"
    - "packs/*/*/**/*.rake"
    - "Rakefile"
  Exclude:
    - "lib/rubocop/**/*"
  AllowedFiles:
    - "packs/platform/tenancy/app/public/tenancy.rb"
    # Outbox reads across all organizations (relay, purges, lag).
    - "packs/platform/events/app/services/events/cross_tenant.rb"
    # Context selector: reads a user's memberships across all organizations.
    - "packs/platform/access/app/services/access/membership_directory.rb"
    # Anonymous lookup of a company by its public slug, before any tenant exists (one company and its organization, readonly).
    - "packs/platform/tenancy/app/public/tenancy/public_directory.rb"
    # Purges expired idempotency_keys across all organizations.
    - "packs/platform/idempotency/app/services/idempotency/cross_tenant.rb"

# rubocop-rails limits these cops to the root app/models, app/controllers...; without this they would skip the packs.
Rails/EnumHash:
  Include:
    - "**/app/models/**/*.rb"
Rails/InverseOf:
  Include:
    - "**/app/models/**/*.rb"
Rails/LexicallyScopedActionFilter:
  Include:
    - "**/app/controllers/**/*.rb"
    - "**/app/mailers/**/*.rb"
