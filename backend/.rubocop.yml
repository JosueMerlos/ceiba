# Estilo base: rubocop-rails-omakase (el de Rails 8). Encima se añaden las reglas de Rails,
# RSpec y FactoryBot. Decisión documentada en docs/architecture/12-testing-strategy.md.
inherit_gem:
  rubocop-rails-omakase: rubocop.yml

# Cops propios (lib/rubocop/cop). Ceiba/PackNamespace: el namespace de un archivo es el de su pack.
require:
  - ./lib/rubocop/cop/ceiba/pack_namespace
  - ./lib/rubocop/cop/ceiba/tenant_bypass
  - ./lib/rubocop/cop/ceiba/access_policy_roles
  - ./lib/rubocop/cop/ceiba/authorization_skips
  - ./lib/rubocop/cop/ceiba/directory_writes

plugins:
  - rubocop-rails
  - rubocop-rspec
  - rubocop-factory_bot

AllCops:
  NewCops: enable
  TargetRubyVersion: 3.4
  Exclude:
    - "bin/**/*"
    - "tmp/**/*"
    - "vendor/**/*"
    - "node_modules/**/*"

# Los specs se escriben en español: los contextos empiezan por estas palabras.
RSpec/ContextWording:
  Prefixes:
    - con
    - sin
    - cuando
    - al
    - si

# Los specs describen comportamiento en español; el nombre del archivo sigue a la clase/ruta.
RSpec/DescribeClass:
  Exclude:
    - "spec/requests/**/*"
    - "spec/api/**/*"
    - "packs/*/*/spec/api/**/*"
    - "spec/config/**/*"
    - "spec/packs/**/*"
    - "spec/db/**/*"
    - "spec/generators/model_generator_spec.rb"
    - "packs/*/*/spec/package_spec.rb"
    - "packs/platform/database/spec/database/**/*"
    - "packs/platform/events/spec/**/*"
    - "packs/platform/audit/spec/**/*"
    - "packs/platform/idempotency/spec/**/*"
    - "packs/platform/tenancy/spec/config/**/*"
    - "packs/platform/tenancy/spec/factories_spec.rb"
    - "packs/platform/tenancy/spec/public_api_spec.rb"
    - "packs/platform/identity/spec/public_api_spec.rb"
    - "packs/platform/identity/spec/public/identity/authenticate_audit_spec.rb"
    - "packs/platform/tenancy/spec/public/**/*"
    - "packs/platform/access/spec/**/*"
    - "spec/platform/**/*"

# Los ejemplos de resiliencia (timeouts, conexiones colgadas) necesitan varias expectativas. Los de la matriz de acceso
# (platform/access) comprueban el mismo alcance contra varios recursos (empresa propia/ajena, sucursal propia/hermana...).
RSpec/MultipleExpectations:
  Max: 3
  Exclude:
    - "packs/platform/access/spec/**/*"

# Los specs de acceso montan un árbol organización > empresas > sucursales (A1, A2, B1...) y varias organizaciones:
# muchos `let` con nombres de dominio (branch_a1) son la forma legible de hacerlo.
RSpec/MultipleMemoizedHelpers:
  Exclude:
    - "packs/platform/access/spec/**/*"
RSpec/IndexedLet:
  Exclude:
    - "packs/platform/access/spec/**/*"
RSpec/SpecFilePathFormat:
  Exclude:
    - "packs/platform/access/spec/**/*"

RSpec/ExampleLength:
  Max: 15

# rswag declara sus ejemplos con `run_test!` y prepara la sesión con `let!`: rubocop-rspec no los reconoce.
RSpec/EmptyExampleGroup:
  Exclude:
    - "spec/api/**/*"
    - "packs/*/*/spec/api/**/*"

RSpec/LetSetup:
  Exclude:
    - "spec/api/**/*"
    - "packs/*/*/spec/api/**/*"

RSpec/NestedGroups:
  Max: 4

# El namespace de cada archivo de un pack debe empezar por el nombre del pack (02-modular-monolith).
Ceiba/PackNamespace:
  Enabled: true
  Include:
    - "packs/*/*/app/**/*.rb"

# Las policies preguntan por permisos, nunca por roles ni por admin? (ADR-0008).
Ceiba/AccessPolicyRoles:
  Enabled: true
  Include:
    - "packs/*/*/app/policies/**/*.rb"

# La autorización solo se omite con skip_authorization!(reason:, only:) (allowlist revisada en spec/requests/api/authorization_spec.rb).
Ceiba/AuthorizationSkips:
  Enabled: true
  Include:
    - "app/controllers/**/*.rb"
    - "packs/*/*/app/controllers/**/*.rb"

# Tenancy::Directory es de solo lectura: nada de update_all/delete_all/readonly(false) a través de él.
Ceiba/DirectoryWrites:
  Enabled: true
  Include:
    - "app/**/*.rb"
    - "packs/*/*/app/**/*.rb"
    - "lib/**/*.rb"
    - "db/**/*.rb"
  Exclude:
    - "lib/rubocop/**/*"

# Nadie se salta el aislamiento de tenant (ActsAsTenant.without_tenant, unscoped...) fuera de esta lista. Cada archivo
# que se añada aquí es un camino privilegiado y exige revisión (CODEOWNERS): reportes consolidados, back-office.
# Tenancy.with_context es el único que fija el tenant. Los specs no se revisan (los tests de bypass lo necesitan).
Ceiba/TenantBypass:
  Enabled: true
  Include:
    - "app/**/*.rb"
    - "packs/*/*/app/**/*.rb"
    - "packs/*/*/lib/**/*.rb"
    - "lib/**/*.rb"
    - "db/**/*.rb"
    - "config/**/*.rb"
    - "lib/**/*.rake"
    - "packs/*/*/**/*.rake"
    - "Rakefile"
  Exclude:
    - "lib/rubocop/**/*"
  AllowedFiles:
    - "packs/platform/tenancy/app/public/tenancy.rb"
    # Lecturas del outbox de todas las organizaciones (relay, purgas, lag): ver el comentario del archivo.
    - "packs/platform/events/app/services/events/cross_tenant.rb"
    # "¿A qué organizaciones pertenece este usuario?" (selector de contexto, GET /organizations): lee memberships de todas.
    - "packs/platform/access/app/services/access/membership_directory.rb"

# rubocop-rails limita estos cops a app/models, app/controllers... de la raíz; sin esto no
# revisarían los packs (packs-rails, "Ecosystem and Integrations").
Rails/EnumHash:
  Include:
    - "**/app/models/**/*.rb"
Rails/InverseOf:
  Include:
    - "**/app/models/**/*.rb"
Rails/LexicallyScopedActionFilter:
  Include:
    - "**/app/controllers/**/*.rb"
    - "**/app/mailers/**/*.rb"
