# Only the checkers we use are loaded: privacy (app/public), layers and visibility
# (visibility stops one module from using another; the layer checker alone allows same-layer dependencies).
require:
  - packwerk/privacy/checker
  - packwerk/layer/checker
  - packwerk/visibility/checker

# Packs live in packs/<layer>/<name>, plus the root pack.
package_paths:
  - "."
  - "packs/*/*"

# Highest layer first: a layer may only depend on those below it.
layers:
  - modules
  - platform

exclude:
  - "{bin,node_modules,script,tmp,vendor,spec,lib}/**/*"
  - "packs/*/*/spec/**/*"
  - "packs/*/*/manifest.rb"

cache: true
