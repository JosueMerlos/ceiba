# Avisos de seguridad ignorados por bundler-audit.
# Política (M0.02): solo con motivo y fecha de revisión, nunca un ignore permanente.
# Formato de cada entrada (lo verifica spec/config/audit_ignores_spec.rb):
#   - CVE-AAAA-NNNNN  # revisar: AAAA-MM-DD | motivo: por qué no aplica / qué lo desbloquea
# Una fecha vencida hace fallar la suite: se revisa el aviso o se retira el ignorado.
ignore: []
