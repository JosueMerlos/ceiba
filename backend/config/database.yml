# Connection parameters come from environment variables.
# DATABASE_URL is deliberately not used: in test it would override the database name and specs would run against the
# development database.
#
# TWO ROLES:
#   app_user   default: server, worker, console, runner, specs, db:seed and any unlisted task. It does not own tables, is
#              not a superuser and lacks BYPASSRLS, so RLS policies apply to it.
#   app_owner  only the schema tasks in the DbRoles::OWNER_TASKS allowlist (db:create, db:migrate, db:rollback,
#              db:schema:load, db:prepare...) or an explicit DB_ROLE=owner.
# DB_ROLE=owner|user forces the role. Seeds always run as app_user. The roles are created by infra/db/init-roles.sh.
<%
  require File.join(Rails.root, "config/db_roles")
  role = DbRoles.select(DbRoles.top_level_tasks, ENV["DB_ROLE"])
  username = "app_#{role}"
  password = ENV.fetch("APP_#{role.upcase}_PASSWORD", "")
%>
default: &default
  adapter: postgresql
  encoding: unicode
  connect_timeout: 5
  host: <%= ENV.fetch("DB_HOST", "localhost") %>
  username: <%= username %>
  password: <%= password.to_json %>
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  database: ceiba_development

# seeds: false because Rails 8.1 seeds the database when db:prepare creates it or loads it empty (as in CI). Specs assume
# a test database with no organizations, so it is never seeded; seeds are tested with an explicit `db:seed`.
test:
  <<: *default
  database: ceiba_test
  seeds: false

production:
  <<: *default
  database: ceiba_production
