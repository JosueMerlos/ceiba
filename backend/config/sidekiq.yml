# Colas (docs/architecture/06-events-and-jobs.md): critical (relay y entregas), default, notifications, low (reportes y
# mantenimiento). Los pesos reparten el tiempo de los hilos: un envío masivo en notifications no frena el relay.
:concurrency: 5
:queues:
  - [critical, 6]
  - [default, 3]
  - [notifications, 2]
  - [low, 1]
