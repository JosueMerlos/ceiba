name: ${COMPOSE_PROJECT_NAME:-ceiba}

x-backend: &backend
  build:
    context: .
    dockerfile: infra/docker/api.Dockerfile
    args:
      HOST_UID: ${HOST_UID:-1000}
      HOST_GID: ${HOST_GID:-1000}
  image: ceiba-backend:dev
  environment: &backend-env
    RAILS_ENV: ${RAILS_ENV:-development}
    DB_HOST: db
    POSTGRES_USER: ${POSTGRES_USER:-ceiba}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ceiba_dev_password}
    # The API connects as app_user; migrations run as app_owner.
    APP_OWNER_PASSWORD: ${APP_OWNER_PASSWORD:-ceiba_owner_dev_password}
    APP_USER_PASSWORD: ${APP_USER_PASSWORD:-ceiba_user_dev_password}
    REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    SMTP_HOST: mailpit
    SMTP_PORT: "1025"
    PUBLIC_PORT: ${PROXY_PORT:-8080}
  volumes:
    - ./backend:/app/backend
    - bundle:/usr/local/bundle

x-frontend: &frontend
  build:
    context: .
    dockerfile: infra/docker/frontend.Dockerfile
    args:
      HOST_UID: ${HOST_UID:-1000}
      HOST_GID: ${HOST_GID:-1000}
  image: ceiba-frontend:dev
  environment:
    PUBLIC_PORT: ${PROXY_PORT:-8080}
  volumes:
    - ./frontend:/app/frontend
    # node_modules is never mounted from the host: it lives in named volumes
    - frontend_node_modules:/app/frontend/node_modules
    - panel_node_modules:/app/frontend/apps/panel/node_modules
    - booking_node_modules:/app/frontend/apps/booking/node_modules
    - config_node_modules:/app/frontend/packages/config/node_modules
    - api_client_node_modules:/app/frontend/packages/api-client/node_modules
    - ui_node_modules:/app/frontend/packages/ui/node_modules
    - i18n_node_modules:/app/frontend/packages/i18n/node_modules
    - e2e_node_modules:/app/frontend/e2e/node_modules
    # The backend generates the OpenAPI contract; the TS client reads it from here, read-only.
    - ./backend/openapi:/app/backend/openapi:ro

services:
  db:
    image: postgres:18.6-trixie
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ceiba}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ceiba_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-ceiba_development}
      APP_OWNER_PASSWORD: ${APP_OWNER_PASSWORD:-ceiba_owner_dev_password}
      APP_USER_PASSWORD: ${APP_USER_PASSWORD:-ceiba_user_dev_password}
    # pg_stat_statements must be preloaded
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements"]
    volumes:
      # PostgreSQL 18 stores data in /var/lib/postgresql/18/docker, so the parent directory is mounted
      - pg_data:/var/lib/postgresql
      # initdb.d ONLY runs on an empty volume; with an existing volume apply the roles with `make db-roles` (idempotent).
      - ./infra/db/init-roles.sh:/docker-entrypoint-initdb.d/10-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  redis:
    image: redis:7.4.12-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    <<: *backend
    environment:
      <<: *backend-env
      RUN_SETUP: "true"
    command: ["bin/rails", "server", "-b", "0.0.0.0", "-p", "3000"]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 120s

  worker:
    <<: *backend
    command: ["bundle", "exec", "sidekiq", "-C", "config/sidekiq.yml"]
    depends_on:
      # api installs gems and prepares the database; the worker waits for it
      api: { condition: service_healthy }
      db: { condition: service_healthy }
      redis: { condition: service_healthy }

  panel:
    <<: *frontend
    working_dir: /app/frontend/apps/panel
    command: ["pnpm", "dev"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5173/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 120s

  booking:
    <<: *frontend
    working_dir: /app/frontend/apps/booking
    command: ["pnpm", "dev"]
    depends_on:
      # panel installs the workspace dependencies; booking waits for it
      panel: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5174/c/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 60s

  # Playwright E2E. Profile "e2e": not started by `make up`; run it with `bin/ci e2e` or `make e2e`.
  # Shares the proxy network (network_mode) to reach http://localhost:8080 like a real browser, so Host and Origin match
  # the dev environment and Rails `config.hosts` needs no change.
  e2e:
    profiles: ["e2e"]
    build:
      context: .
      dockerfile: infra/docker/e2e.Dockerfile
      args:
        HOST_UID: ${HOST_UID:-1000}
        HOST_GID: ${HOST_GID:-1000}
    # No fixed image tag: Compose names it per project so parallel environments do not clash.
    network_mode: "service:proxy"
    depends_on:
      proxy: { condition: service_healthy }
    environment:
      PLAYWRIGHT_BASE_URL: http://localhost:${PROXY_PORT:-8080}
      E2E_PASSWORD: ${E2E_PASSWORD:-ceiba-demo-2026}
      E2E_RETRIES: ${E2E_RETRIES:-0}
    volumes:
      - ./frontend:/app/frontend
      - frontend_node_modules:/app/frontend/node_modules
      - e2e_node_modules:/app/frontend/e2e/node_modules
    command: ["pnpm", "e2e"]

  mailpit:
    image: axllent/mailpit:v1.33.1
    ports:
      - "127.0.0.1:${MAILPIT_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 10

  proxy:
    image: caddy:2.11.9-alpine
    ports:
      # Caddy listens on the SAME port that is published (PROXY_PORT), so the browser's Host and Origin, and the E2E
      # sharing this network, always see the public port (needed for parallel environments).
      - "127.0.0.1:${PROXY_PORT:-8080}:${PROXY_PORT:-8080}"
    environment:
      PROXY_PORT: ${PROXY_PORT:-8080}
    volumes:
      - ./infra/proxy/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      api: { condition: service_healthy }
      panel: { condition: service_healthy }
      booking: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:$${PROXY_PORT}/__proxy/health"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pg_data:
  redis_data:
  bundle:
  frontend_node_modules:
  panel_node_modules:
  booking_node_modules:
  config_node_modules:
  api_client_node_modules:
  ui_node_modules:
  i18n_node_modules:
  e2e_node_modules:
