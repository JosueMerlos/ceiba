name: ${COMPOSE_PROJECT_NAME:-ceiba}

x-backend: &backend
  build:
    context: .
    dockerfile: infra/docker/api.Dockerfile
    args:
      HOST_UID: ${HOST_UID:-1000}
      HOST_GID: ${HOST_GID:-1000}
  image: ceiba-backend:dev
  environment: &backend-env
    RAILS_ENV: ${RAILS_ENV:-development}
    DB_HOST: db
    POSTGRES_USER: ${POSTGRES_USER:-ceiba}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ceiba_dev_password}
    REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    SMTP_HOST: mailpit
    SMTP_PORT: "1025"
    PUBLIC_PORT: ${PROXY_PORT:-8080}
  volumes:
    - ./backend:/app/backend
    - bundle:/usr/local/bundle

x-frontend: &frontend
  build:
    context: .
    dockerfile: infra/docker/frontend.Dockerfile
    args:
      HOST_UID: ${HOST_UID:-1000}
      HOST_GID: ${HOST_GID:-1000}
  image: ceiba-frontend:dev
  environment:
    PUBLIC_PORT: ${PROXY_PORT:-8080}
  volumes:
    - ./frontend:/app/frontend
    # node_modules nunca se monta desde el host: viven en volúmenes con nombre
    - frontend_node_modules:/app/frontend/node_modules
    - panel_node_modules:/app/frontend/apps/panel/node_modules
    - booking_node_modules:/app/frontend/apps/booking/node_modules
    - config_node_modules:/app/frontend/packages/config/node_modules

services:
  db:
    image: postgres:18.6-trixie
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ceiba}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ceiba_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-ceiba_development}
    volumes:
      # PostgreSQL 18 guarda los datos en /var/lib/postgresql/18/docker: se monta el directorio padre
      - pg_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  redis:
    image: redis:7.4.12-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    <<: *backend
    environment:
      <<: *backend-env
      RUN_SETUP: "true"
    command: ["bin/rails", "server", "-b", "0.0.0.0", "-p", "3000"]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 120s

  worker:
    <<: *backend
    command: ["bundle", "exec", "sidekiq", "-C", "config/sidekiq.yml"]
    depends_on:
      # api instala las gems y prepara la base: el worker espera a que termine
      api: { condition: service_healthy }
      db: { condition: service_healthy }
      redis: { condition: service_healthy }

  panel:
    <<: *frontend
    working_dir: /app/frontend/apps/panel
    command: ["pnpm", "dev"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5173/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 120s

  booking:
    <<: *frontend
    working_dir: /app/frontend/apps/booking
    command: ["pnpm", "dev"]
    depends_on:
      # panel instala las dependencias del workspace: booking espera a que termine
      panel: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5174/c/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 60s

  mailpit:
    image: axllent/mailpit:v1.33.1
    ports:
      - "127.0.0.1:${MAILPIT_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 10

  proxy:
    image: caddy:2.11.9-alpine
    ports:
      - "127.0.0.1:${PROXY_PORT:-8080}:8080"
    volumes:
      - ./infra/proxy/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      api: { condition: service_healthy }
      panel: { condition: service_healthy }
      booking: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/__proxy/health"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pg_data:
  redis_data:
  bundle:
  frontend_node_modules:
  panel_node_modules:
  booking_node_modules:
  config_node_modules:
